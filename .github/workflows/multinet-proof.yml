name: MULTINET Transport Proof

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read

concurrency:
  group: dniv-multinet-proof
  queue: max
  cancel-in-progress: false

jobs:
  prove-multinet:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == 'DNIV MULTINET proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install MULTINET proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv libpcap-dev

      - name: Prove PyDECnet MULTINET framing, modes and reconnect
        shell: bash
        run: tests/lab/prove-multinet.sh
