name: MULTINET Transport Proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main candidate SHA supplied by the acceptance dispatcher
        required: true
        type: string
      parent_run_id:
        description: Acceptance dispatcher run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dniv-multinet-proof
  queue: max
  cancel-in-progress: false

jobs:
  prove-multinet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install MULTINET proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv libpcap-dev

      - name: Prove PyDECnet MULTINET framing, modes and reconnect
        shell: bash
        run: tests/lab/prove-multinet.sh
