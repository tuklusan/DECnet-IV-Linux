name: Source Release Reproducibility

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        required: false
        type: string
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  package-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/source-release-amd64
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR"             --workflow source-release --job source-release --arch amd64             --mode reproducibility --source-sha "$candidate"             --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main
      - name: Install source build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential linux-headers-generic python3 kmod xz-utils
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$KDIR"
          KERNEL_RELEASE=$(basename "$KDIR")
          KERNEL_RELEASE=${KERNEL_RELEASE#linux-headers-}
          printf 'KDIR=%s\nKERNEL_RELEASE=%s\n' "$KDIR" "$KERNEL_RELEASE" >>"$GITHUB_ENV"
      - name: Build source archive twice
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-ci-${GITHUB_SHA:0:12}"
          mkdir -p "$DNIV_SCRATCH_DIR/a" "$DNIV_SCRATCH_DIR/b" "$DNIV_SCRATCH_DIR/release"
          a=$(tools/build-source-release.sh "$DNIV_SCRATCH_DIR/a" "$version" "$GITHUB_SHA")
          b=$(tools/build-source-release.sh "$DNIV_SCRATCH_DIR/b" "$version" "$GITHUB_SHA")
          cmp "$a" "$b"
          (
            cd "$DNIV_SCRATCH_DIR"
            relative=$("$GITHUB_WORKSPACE/tools/build-source-release.sh" relative "$version" "$GITHUB_SHA")
            cmp "$a" "$relative"
          )
          cp "$a" "$DNIV_SCRATCH_DIR/release/"
          cp "$a.sha256" "$DNIV_SCRATCH_DIR/release/"
          basename "$a" >"$DNIV_SCRATCH_DIR/release/archive-name.txt"
      - name: Reject invalid source release inputs
        shell: bash
        run: |
          set -euo pipefail
          release="$DNIV_SCRATCH_DIR/release"
          archive=$(cat "$release/archive-name.txt")
          negative="$RUNNER_TEMP/source-release-negatives"
          rm -rf "$negative"
          mkdir -p "$negative/checksum" "$negative/tree"

          cp "$release/$archive" "$negative/checksum/$archive"
          cp "$release/$archive.sha256" "$negative/checksum/$archive.sha256"
          printf '\0audit-corruption\n' >>"$negative/checksum/$archive"
          if (cd "$negative/checksum" && sha256sum -c "$archive.sha256"); then
            echo "source-release: checksum-mismatch negative unexpectedly succeeded" >&2
            exit 1
          fi

          cp "$release/$archive" "$negative/truncated.tar.xz"
          archive_size=$(stat -c %s "$negative/truncated.tar.xz")
          truncate -s $((archive_size / 2)) "$negative/truncated.tar.xz"
          if tar -tJf "$negative/truncated.tar.xz" >/dev/null 2>&1; then
            echo "source-release: truncated-archive negative unexpectedly succeeded" >&2
            exit 1
          fi

          tar -xJf "$release/$archive" -C "$negative/tree"
          candidate=$(find "$negative/tree" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$candidate"
          validate_release_tree() {
            local tree=$1
            test -s "$tree/SOURCE-METADATA" || return 1
            grep -Fqx "source_sha=$GITHUB_SHA" "$tree/SOURCE-METADATA" || return 1
            grep -Eq '^version=[A-Za-z0-9._+-]+$' "$tree/SOURCE-METADATA" || return 1
            grep -Eq '^source_date_epoch=[0-9]+$' "$tree/SOURCE-METADATA" || return 1
            if find "$tree" \( -name .git -o -name __pycache__ -o -name '*.pyc' -o -name '*.qcow2' -o -name '*.raw' -o -name '*.img' -o -name '*.iso' -o -name '*.ko' -o -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.so.*' \) -print -quit | grep -q .; then
              return 1
            fi
          }
          validate_release_tree "$candidate"

          mv "$candidate/SOURCE-METADATA" "$candidate/SOURCE-METADATA.audit"
          if validate_release_tree "$candidate"; then
            echo "source-release: missing-SOURCE-METADATA negative unexpectedly succeeded" >&2
            exit 1
          fi
          mv "$candidate/SOURCE-METADATA.audit" "$candidate/SOURCE-METADATA"

          cp "$candidate/SOURCE-METADATA" "$candidate/SOURCE-METADATA.audit"
          sed -i 's/^source_sha=.*/source_sha=0000000000000000000000000000000000000000/' "$candidate/SOURCE-METADATA"
          if validate_release_tree "$candidate"; then
            echo "source-release: wrong-source-metadata negative unexpectedly succeeded" >&2
            exit 1
          fi
          mv "$candidate/SOURCE-METADATA.audit" "$candidate/SOURCE-METADATA"

          printf 'not a disk image\n' >"$candidate/audit.qcow2"
          if validate_release_tree "$candidate"; then
            echo "source-release: generated-payload negative unexpectedly succeeded" >&2
            exit 1
          fi
          rm "$candidate/audit.qcow2"

          if tools/build-source-release.sh "$negative/bad-pin" audit-bad-pin 0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo "source-release: wrong-pin negative unexpectedly succeeded" >&2
            exit 1
          fi

          mkdir "$negative/read-only-output"
          chmod 0555 "$negative/read-only-output"
          if tools/build-source-release.sh "$negative/read-only-output" audit-read-only "$GITHUB_SHA" >/dev/null 2>&1; then
            echo "source-release: read-only-output negative unexpectedly succeeded" >&2
            exit 1
          fi
          chmod 0755 "$negative/read-only-output"
      - name: Build install and uninstall extracted source
        shell: bash
        run: |
          set -euo pipefail
          archive=$(cat "$DNIV_SCRATCH_DIR/release/archive-name.txt")
          mkdir "$RUNNER_TEMP/src" "$RUNNER_TEMP/stage"
          tar -xJf "$DNIV_SCRATCH_DIR/release/$archive" -C "$RUNNER_TEMP/src"
          src=$(find "$RUNNER_TEMP/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$src"
          test ! -e "$src/.git"
          cd "$src"

          if KDIR="$RUNNER_TEMP/missing-kdir" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh >/dev/null 2>&1; then
            echo "source-release: missing-kernel-tree negative unexpectedly succeeded" >&2
            exit 1
          fi
          if KDIR="$KDIR" KERNEL_RELEASE=0.0.0-wrong ./build.sh >/dev/null 2>&1; then
            echo "source-release: wrong-kernel-release negative unexpectedly succeeded" >&2
            exit 1
          fi

          fake_kernel="$RUNNER_TEMP/kernel-6.7"
          mkdir -p "$fake_kernel/include/config"
          printf '6.7.0\n' >"$fake_kernel/include/config/kernel.release"
          printf 'kernelversion:\n\t@printf "%%s\\n" 6.7.0\n' >"$fake_kernel/Makefile"
          if KDIR="$fake_kernel" KERNEL_RELEASE=6.7.0 ./build.sh >/dev/null 2>&1; then
            echo "source-release: below-kernel-floor negative unexpectedly succeeded" >&2
            exit 1
          fi

          fake_python="$RUNNER_TEMP/python-3.9"
          printf '#!/usr/bin/env bash\nexit 1\n' >"$fake_python"
          chmod +x "$fake_python"
          if PYTHON="$fake_python" KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh >/dev/null 2>&1; then
            echo "source-release: below-python-floor negative unexpectedly succeeded" >&2
            exit 1
          fi

          fake_gcc="$RUNNER_TEMP/gcc-11"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            "  --version) printf 'gcc (GCC) 11.5.0\\n' ;;" \
            "  -dumpfullversion|-dumpversion) printf '11.5.0\\n' ;;" \
            '  *) exit 99 ;;' \
            'esac' >"$fake_gcc"
          chmod +x "$fake_gcc"
          if CC="$fake_gcc" KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh >/dev/null 2>&1; then
            echo "source-release: below-gcc-floor negative unexpectedly succeeded" >&2
            exit 1
          fi

          fake_clang="$RUNNER_TEMP/clang-15"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'case "$1" in' \
            "  --version) printf 'clang version 15.0.7\\n' ;;" \
            "  -dumpfullversion|-dumpversion) printf '15.0.7\\n' ;;" \
            '  *) exit 99 ;;' \
            'esac' >"$fake_clang"
          chmod +x "$fake_clang"
          if CC="$fake_clang" KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh >/dev/null 2>&1; then
            echo "source-release: below-clang-floor negative unexpectedly succeeded" >&2
            exit 1
          fi

          KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh
          live_root_err="$RUNNER_TEMP/custom-live-module-root.err"
          if MODULE_ROOT=/opt/dniv-kmods KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh >"$live_root_err" 2>&1; then
            echo "source-release: custom-live-module-root negative unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fqx "install.sh: custom MODULE_ROOT is supported only with non-empty DESTDIR" "$live_root_err"
          if MODULE_ROOT=/opt/dniv-kmods KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh >"$live_root_err" 2>&1; then
            echo "source-release: custom-live-module-root uninstall negative unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fqx "uninstall.sh: custom MODULE_ROOT is supported only with non-empty DESTDIR" "$live_root_err"
          if KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh >/dev/null 2>&1; then
            echo "source-release: non-root-live-install negative unexpectedly succeeded" >&2
            exit 1
          fi

          fail_stage="$RUNNER_TEMP/fail-stage"
          mv userspace/dnnml/dnnml userspace/dnnml/dnnml.audit-backup
          if DESTDIR="$fail_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: missing-artifact negative unexpectedly succeeded" >&2
            exit 1
          fi
          mv userspace/dnnml/dnnml.audit-backup userspace/dnnml/dnnml
          test -s "$fail_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          DESTDIR="$fail_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          if find "$fail_stage" \( -type f -o -type l \) -print -quit | grep -q .; then
            echo "source-release: interrupted-install cleanup left tracked files" >&2
            exit 1
          fi

          conflict_stage="$RUNNER_TEMP/conflict-stage"
          mkdir -p "$conflict_stage/usr/local/bin"
          printf 'foreign-ncp\n' >"$conflict_stage/usr/local/bin/ncp"
          if DESTDIR="$conflict_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: unmanaged-target negative unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fqx 'foreign-ncp' "$conflict_stage/usr/local/bin/ncp"
          test -s "$conflict_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          DESTDIR="$conflict_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          grep -Fqx 'foreign-ncp' "$conflict_stage/usr/local/bin/ncp"

          if DESTDIR=relative KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: relative-DESTDIR negative unexpectedly succeeded" >&2
            exit 1
          fi
          if DESTDIR="$RUNNER_TEMP//double-slash-stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: non-normalized-DESTDIR negative unexpectedly succeeded" >&2
            exit 1
          fi
          if DESTDIR=$'/tmp/dniv\nstage' KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: newline-DESTDIR negative unexpectedly succeeded" >&2
            exit 1
          fi
          if DESTDIR=$'/tmp/dniv\rstage' KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh; then
            echo "source-release: carriage-return-DESTDIR uninstall negative unexpectedly succeeded" >&2
            exit 1
          fi
          if DESTDIR="$RUNNER_TEMP/bad-prefix-line-stage" PREFIX=$'/opt/dniv\nescape' KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: newline-PREFIX negative unexpectedly succeeded" >&2
            exit 1
          fi
          if DESTDIR="$RUNNER_TEMP/bad-module-line-stage" MODULE_ROOT=$'/opt/dniv\nmodules' KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: newline-MODULE_ROOT negative unexpectedly succeeded" >&2
            exit 1
          fi

          manifest_temp_stage="$RUNNER_TEMP/manifest-temp-symlink-stage"
          manifest_temp_victim="$RUNNER_TEMP/manifest-temp-symlink-victim"
          mkdir -p "$manifest_temp_stage/usr/local/share/decnet-iv-linux"
          printf 'foreign-victim\n' >"$manifest_temp_victim"
          STAGE="$manifest_temp_stage" VICTIM="$manifest_temp_victim" KERNEL_RELEASE="$KERNEL_RELEASE" bash -c '
            predictable="$STAGE/usr/local/share/decnet-iv-linux/install-manifest.txt.tmp.$BASHPID"
            ln -s "$VICTIM" "$predictable"
            exec env DESTDIR="$STAGE" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          '
          grep -Fqx 'foreign-victim' "$manifest_temp_victim"
          test -f "$manifest_temp_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          test ! -L "$manifest_temp_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          rm -f "$manifest_temp_stage/usr/local/share/decnet-iv-linux/install-manifest.txt.tmp."*
          DESTDIR="$manifest_temp_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh

          manifest_hardlink_stage="$RUNNER_TEMP/manifest-hardlink-stage"
          manifest_hardlink_victim="$RUNNER_TEMP/manifest-hardlink-victim"
          manifest_hardlink="$manifest_hardlink_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          mkdir -p "$(dirname "$manifest_hardlink")"
          printf '/usr/local/bin/ncp\n' >"$manifest_hardlink_victim"
          ln "$manifest_hardlink_victim" "$manifest_hardlink"
          cp "$manifest_hardlink_victim" "$RUNNER_TEMP/manifest-hardlink-expected"
          if DESTDIR="$manifest_hardlink_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: hard-linked-manifest negative unexpectedly succeeded" >&2
            exit 1
          fi
          cmp "$RUNNER_TEMP/manifest-hardlink-expected" "$manifest_hardlink_victim"
          test "$(stat -c %h -- "$manifest_hardlink_victim")" = 2
          rm -f "$manifest_hardlink"

          symlink_stage="$RUNNER_TEMP/symlink-parent-stage"
          symlink_escape="$RUNNER_TEMP/symlink-parent-escape"
          mkdir -p "$symlink_stage/usr/local" "$symlink_escape"
          ln -s "$symlink_escape" "$symlink_stage/usr/local/share"
          if DESTDIR="$symlink_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: staged-parent-symlink negative unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e "$symlink_escape/decnet-iv-linux/install-manifest.txt"

          uninstall_stage="$RUNNER_TEMP/uninstall-symlink-stage"
          uninstall_escape="$RUNNER_TEMP/uninstall-symlink-escape"
          DESTDIR="$uninstall_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          mkdir -p "$uninstall_escape"
          mv "$uninstall_stage/usr/local/bin" "$uninstall_stage/usr/local/bin.real"
          ln -s "$uninstall_escape" "$uninstall_stage/usr/local/bin"
          printf 'external-ncp\n' >"$uninstall_escape/ncp"
          if DESTDIR="$uninstall_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh; then
            echo "source-release: uninstall-parent-symlink negative unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fqx 'external-ncp' "$uninstall_escape/ncp"
          rm "$uninstall_stage/usr/local/bin"
          mv "$uninstall_stage/usr/local/bin.real" "$uninstall_stage/usr/local/bin"
          DESTDIR="$uninstall_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          if DESTDIR="$RUNNER_TEMP/wrong-release" KERNEL_RELEASE=0.0.0-wrong ./install.sh; then
            echo "source-release: module-vermagic negative unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/wrong-release/usr/local/share/decnet-iv-linux/install-manifest.txt"

          type_stage="$RUNNER_TEMP/type-stage"
          DESTDIR="$type_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          rm -f "$type_stage/usr/local/bin/ncp"
          mkdir "$type_stage/usr/local/bin/ncp"
          if DESTDIR="$type_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: managed-target-type negative unexpectedly succeeded" >&2
            exit 1
          fi
          rmdir "$type_stage/usr/local/bin/ncp"
          DESTDIR="$type_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh

          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          manifest="$RUNNER_TEMP/stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          expected_manifest="$RUNNER_TEMP/expected-install-manifest.txt"
          cat >"$expected_manifest" <<EOF_MANIFEST
          /lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko
          /usr/local/sbin/dnctl
          /usr/local/sbin/dnetd
          /usr/local/sbin/dnfald
          /usr/local/sbin/dnnml
          /usr/local/sbin/dnphoned
          /usr/local/sbin/dnmaild
          /usr/local/sbin/dnhttpd
          /usr/local/sbin/dnmultinet
          /usr/local/bin/ncp
          /usr/local/bin/dnlogin
          /usr/local/bin/sethost
          /usr/local/bin/dncopy
          /usr/local/bin/dntype
          /usr/local/bin/dndir
          /usr/local/bin/dndel
          /usr/local/bin/dnrename
          /usr/local/bin/dnsubmit
          /usr/local/bin/dnprint
          /usr/local/bin/dntask
          /usr/local/bin/dnnice
          /usr/local/bin/dnmirror
          /usr/local/bin/dnobject
          /usr/local/bin/phone
          /usr/local/bin/dnmail
          /usr/local/bin/dnlynx
          /usr/local/bin/dnping
          /usr/local/lib/libdnet.a
          /usr/local/lib/libdnet.so.1.0
          /usr/local/lib/libdnet.so.1
          /usr/local/lib/libdnet.so
          /usr/local/lib/libdnet_daemon.a
          /usr/local/lib/libdnet_daemon.so.1.0
          /usr/local/lib/libdnet_daemon.so.1
          /usr/local/lib/libdnet_daemon.so
          /usr/local/include/netdnet/dn.h
          /usr/local/include/netdnet/dnetdb.h
          /usr/local/include/linux/dn.h
          /usr/local/include/linux/decnet_iv.h
          /usr/local/share/doc/decnet-iv-linux/README.md
          /usr/local/share/doc/decnet-iv-linux/INSTALL.md
          /usr/local/share/doc/decnet-iv-linux/LICENSE
          /usr/local/share/doc/decnet-iv-linux/DELIVERY.md
          /usr/local/share/doc/decnet-iv-linux/FEATURES.md
          /usr/local/share/doc/decnet-iv-linux/COMPONENTS.md
          /usr/local/share/doc/decnet-iv-linux/ARCHITECTURE.md
          /usr/local/share/doc/decnet-iv-linux/SOURCE-METADATA
          EOF_MANIFEST
          sort -u "$expected_manifest" -o "$expected_manifest"
          if ! cmp -s "$expected_manifest" "$manifest"; then
            echo "source-release: installed-manifest completeness mismatch" >&2
            diff -u "$expected_manifest" "$manifest" >&2 || true
            exit 1
          fi
          while IFS= read -r installed; do
            [[ -e "$RUNNER_TEMP/stage$installed" || -L "$RUNNER_TEMP/stage$installed" ]] || {
              echo "source-release: manifest target missing after install: $installed" >&2
              exit 1
            }
          done <"$expected_manifest"
          test -s "$RUNNER_TEMP/stage/usr/local/sbin/dnctl"
          test -s "$RUNNER_TEMP/stage/usr/local/bin/ncp"
          test -s "$RUNNER_TEMP/stage/usr/local/lib/libdnet.so.1.0"
          test -s "$RUNNER_TEMP/stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          old_release=0.0.0-audit-old
          mkdir -p "$RUNNER_TEMP/stage/lib/modules/$old_release/extra"
          printf 'old-module-placeholder\n' >"$RUNNER_TEMP/stage/lib/modules/$old_release/extra/decnet_iv.ko"
          printf '/lib/modules/%s/extra/decnet_iv.ko\n' "$old_release" >>             "$RUNNER_TEMP/stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          grep -Fqx "/lib/modules/$old_release/extra/decnet_iv.ko"             "$RUNNER_TEMP/stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          while IFS= read -r installed; do
            [[ ! -e "$RUNNER_TEMP/stage$installed" && ! -L "$RUNNER_TEMP/stage$installed" ]] || {
              echo "source-release: manifest target remains after uninstall: $installed" >&2
              exit 1
            }
          done <"$expected_manifest"
          test ! -e "$RUNNER_TEMP/stage/usr/local/sbin/dnctl"
          test ! -e "$RUNNER_TEMP/stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          test ! -e "$RUNNER_TEMP/stage/lib/modules/$old_release/extra/decnet_iv.ko"

          custom_stage="$RUNNER_TEMP/custom-module-root-stage"
          custom_root=/opt/dniv-kmods
          DESTDIR="$custom_stage" MODULE_ROOT="$custom_root" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          custom_manifest="$custom_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          printf '/lib/modules/%s/extra/decnet_iv.ko\n' "$old_release" >>"$custom_manifest"
          if DESTDIR="$custom_stage" MODULE_ROOT="$custom_root" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: custom-module-root foreign-manifest negative unexpectedly succeeded" >&2
            exit 1
          fi
          sed -i '\|^/lib/modules/'"$old_release"'/extra/decnet_iv\.ko$|d' "$custom_manifest"
          DESTDIR="$custom_stage" MODULE_ROOT="$custom_root" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          test ! -e "$custom_stage$custom_root/extra/decnet_iv.ko"

          custom_prefix_stage="$RUNNER_TEMP/custom-prefix-stage"
          custom_prefix=/opt/decnet
          env -u KERNEL_RELEASE DESTDIR="$custom_prefix_stage" PREFIX="$custom_prefix" ./install.sh
          custom_prefix_manifest="$custom_prefix_stage$custom_prefix/share/decnet-iv-linux/install-manifest.txt"
          grep -Fqx "/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko" "$custom_prefix_manifest"
          grep -Fqx "$custom_prefix/bin/ncp" "$custom_prefix_manifest"
          grep -Fqx "$custom_prefix/sbin/dnctl" "$custom_prefix_manifest"
          grep -Fqx "$custom_prefix/lib/libdnet.so.1.0" "$custom_prefix_manifest"
          grep -Fqx "$custom_prefix/share/doc/decnet-iv-linux/SOURCE-METADATA" "$custom_prefix_manifest"
          if grep -Fq "/usr/local/" "$custom_prefix_manifest"; then
            echo "source-release: custom-prefix manifest leaked default-prefix paths" >&2
            exit 1
          fi
          test -s "$custom_prefix_stage$custom_prefix/bin/ncp"
          test -s "$custom_prefix_stage$custom_prefix/sbin/dnctl"
          test -s "$custom_prefix_stage$custom_prefix/lib/libdnet.so.1.0"
          test -s "$custom_prefix_stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          env -u KERNEL_RELEASE DESTDIR="$custom_prefix_stage" PREFIX="$custom_prefix" ./uninstall.sh
          test ! -e "$custom_prefix_stage$custom_prefix/bin/ncp"
          test ! -e "$custom_prefix_stage$custom_prefix/sbin/dnctl"
          test ! -e "$custom_prefix_stage$custom_prefix/lib/libdnet.so.1.0"
          test ! -e "$custom_prefix_stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          test ! -e "$custom_prefix_manifest"

          if DESTDIR="$RUNNER_TEMP/bad-prefix-stage" PREFIX=relative KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: relative-PREFIX negative unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final             --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json"             --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"
      - name: Preserve exact source release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decnet-iv-linux-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  validate-arm64:
    needs: package-amd64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/source-release-arm64
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR"             --workflow source-release --job source-release --arch arm64             --mode extracted-source --source-sha "$candidate"             --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main
      - name: Download exact source release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decnet-iv-linux-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Install source build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential linux-headers-generic python3 kmod xz-utils
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$KDIR"
          KERNEL_RELEASE=$(basename "$KDIR")
          KERNEL_RELEASE=${KERNEL_RELEASE#linux-headers-}
          printf 'KDIR=%s\nKERNEL_RELEASE=%s\n' "$KDIR" "$KERNEL_RELEASE" >>"$GITHUB_ENV"
      - name: Validate build install and uninstall
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'DECnet-IV-Linux-*.tar.xz' -print -quit)
          test -n "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          mkdir "$RUNNER_TEMP/src" "$RUNNER_TEMP/stage"
          tar -xJf "$archive" -C "$RUNNER_TEMP/src"
          src=$(find "$RUNNER_TEMP/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test ! -e "$src/.git"
          grep -Fqx "source_sha=$GITHUB_SHA" "$src/SOURCE-METADATA"
          cd "$src"
          KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          manifest="$RUNNER_TEMP/stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          expected_manifest="$RUNNER_TEMP/expected-install-manifest-arm64.txt"
          cat >"$expected_manifest" <<EOF_MANIFEST
          /lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko
          /usr/local/sbin/dnctl
          /usr/local/sbin/dnetd
          /usr/local/sbin/dnfald
          /usr/local/sbin/dnnml
          /usr/local/sbin/dnphoned
          /usr/local/sbin/dnmaild
          /usr/local/sbin/dnhttpd
          /usr/local/sbin/dnmultinet
          /usr/local/bin/ncp
          /usr/local/bin/dnlogin
          /usr/local/bin/sethost
          /usr/local/bin/dncopy
          /usr/local/bin/dntype
          /usr/local/bin/dndir
          /usr/local/bin/dndel
          /usr/local/bin/dnrename
          /usr/local/bin/dnsubmit
          /usr/local/bin/dnprint
          /usr/local/bin/dntask
          /usr/local/bin/dnnice
          /usr/local/bin/dnmirror
          /usr/local/bin/dnobject
          /usr/local/bin/phone
          /usr/local/bin/dnmail
          /usr/local/bin/dnlynx
          /usr/local/bin/dnping
          /usr/local/lib/libdnet.a
          /usr/local/lib/libdnet.so.1.0
          /usr/local/lib/libdnet.so.1
          /usr/local/lib/libdnet.so
          /usr/local/lib/libdnet_daemon.a
          /usr/local/lib/libdnet_daemon.so.1.0
          /usr/local/lib/libdnet_daemon.so.1
          /usr/local/lib/libdnet_daemon.so
          /usr/local/include/netdnet/dn.h
          /usr/local/include/netdnet/dnetdb.h
          /usr/local/include/linux/dn.h
          /usr/local/include/linux/decnet_iv.h
          /usr/local/share/doc/decnet-iv-linux/README.md
          /usr/local/share/doc/decnet-iv-linux/INSTALL.md
          /usr/local/share/doc/decnet-iv-linux/LICENSE
          /usr/local/share/doc/decnet-iv-linux/DELIVERY.md
          /usr/local/share/doc/decnet-iv-linux/FEATURES.md
          /usr/local/share/doc/decnet-iv-linux/COMPONENTS.md
          /usr/local/share/doc/decnet-iv-linux/ARCHITECTURE.md
          /usr/local/share/doc/decnet-iv-linux/SOURCE-METADATA
          EOF_MANIFEST
          sort -u "$expected_manifest" -o "$expected_manifest"
          if ! cmp -s "$expected_manifest" "$manifest"; then
            echo "source-release: installed-manifest completeness mismatch" >&2
            diff -u "$expected_manifest" "$manifest" >&2 || true
            exit 1
          fi
          while IFS= read -r installed; do
            [[ -e "$RUNNER_TEMP/stage$installed" || -L "$RUNNER_TEMP/stage$installed" ]] || {
              echo "source-release: manifest target missing after install: $installed" >&2
              exit 1
            }
          done <"$expected_manifest"
          test -s "$RUNNER_TEMP/stage/usr/local/sbin/dnctl"
          test -s "$RUNNER_TEMP/stage/usr/local/bin/ncp"
          test -s "$RUNNER_TEMP/stage/usr/local/lib/libdnet.so.1.0"
          test -s "$RUNNER_TEMP/stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          while IFS= read -r installed; do
            [[ ! -e "$RUNNER_TEMP/stage$installed" && ! -L "$RUNNER_TEMP/stage$installed" ]] || {
              echo "source-release: manifest target remains after uninstall: $installed" >&2
              exit 1
            }
          done <"$expected_manifest"
      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final             --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json"             --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"
      - name: Preserve arm64 source-release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-evidence-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false

  portability:
    needs: package-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/source-release-portability-${{ matrix.arch }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR" \
            --workflow source-release --job portability --arch '${{ matrix.arch }}' \
            --mode exact-release-portability --source-sha "$candidate" \
            --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main

      - name: Download exact source release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decnet-iv-linux-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release

      - name: Build exact archive through maintained distro toolchains
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/release"
          archive=$(find "$source_dir" -maxdepth 1 -name 'DECnet-IV-Linux-*.tar.xz' -print -quit)
          test -n "$archive"
          test -s "$archive.sha256"

          run_case() {
            local distro=$1 image=$2 compiler=$3
            local log="$DNIV_SCRATCH_DIR/${distro}-${compiler}.log"
            docker pull "$image"
            docker run --rm \
              -e DNIV_DISTRO="$distro" \
              -e DNIV_ARCH='${{ matrix.arch }}' \
              -e DNIV_COMPILER="$compiler" \
              -e DNIV_EXPECTED_SHA="$GITHUB_SHA" \
              -v "$source_dir:/release:ro" \
              "$image" bash -ceu '
                if [[ "$DNIV_DISTRO" == debian13 ]]; then
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  if [[ "$DNIV_ARCH" == amd64 ]]; then kh=linux-headers-amd64; else kh=linux-headers-arm64; fi
                  apt-get install -y build-essential clang llvm lld python3 kmod xz-utils git bc bison flex libelf-dev libssl-dev "$kh"
                  KDIR=$(find /usr/src -maxdepth 1 -type d -name "linux-headers-*" ! -name "*-common" | sort -V | tail -1)
                else
                  dnf -y install gcc clang llvm lld make python3 kmod kernel-devel findutils git \
                    bc bison flex elfutils-libelf-devel openssl-devel perl curl xz tar
                  KDIR=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
                fi
                test -n "$KDIR"
                if [[ -r "$KDIR/include/config/kernel.release" ]]; then
                  kernel_release=$(cat "$KDIR/include/config/kernel.release")
                else
                  kernel_release=$(basename "$KDIR")
                  kernel_release=${kernel_release#linux-headers-}
                fi

                archive=$(find /release -maxdepth 1 -name "DECnet-IV-Linux-*.tar.xz" -print -quit)
                test -n "$archive"
                (cd /release && sha256sum -c "$(basename "$archive").sha256")
                rm -rf /src /tmp/dniv-stage
                mkdir /src
                tar -xJf "$archive" -C /src --strip-components=1
                cd /src
                test ! -e .git
                grep -Fqx "source_sha=$DNIV_EXPECTED_SHA" SOURCE-METADATA

                case "$DNIV_COMPILER" in gcc) cc=gcc ;; clang) cc=clang ;; *) exit 2 ;; esac
                if [[ "$DNIV_COMPILER" == clang ]]; then
                  linux_repo=$(sed -n 's/^linux_repo=//p' tests/lab/build-diagnostic-kernel.sh)
                  linux_commit=$(sed -n 's/^linux_commit=//p' tests/lab/build-diagnostic-kernel.sh)
                  test -n "$linux_repo"
                  test -n "$linux_commit"
                  rm -rf /tmp/linux-clang
                  git -C /tmp init -q linux-clang
                  git -C /tmp/linux-clang remote add origin "$linux_repo"
                  git -C /tmp/linux-clang fetch --depth=1 origin "$linux_commit"
                  git -C /tmp/linux-clang checkout -q --detach FETCH_HEAD
                  test "$(git -C /tmp/linux-clang rev-parse HEAD)" = "$linux_commit"
                  rm -rf /tmp/linux-clang/.git
                  LLVM=1 make -C /tmp/linux-clang defconfig >/dev/null
                  /tmp/linux-clang/scripts/config --file /tmp/linux-clang/.config --disable MODVERSIONS
                  /tmp/linux-clang/scripts/config --file /tmp/linux-clang/.config --disable MODULE_SIG_ALL
                  /tmp/linux-clang/scripts/config --file /tmp/linux-clang/.config --disable MODULE_SIG_FORCE
                  LLVM=1 make -C /tmp/linux-clang olddefconfig >/dev/null
                  LLVM=1 make -C /tmp/linux-clang modules_prepare -j2 >/dev/null
                  clang_release=$(cat /tmp/linux-clang/include/config/kernel.release)
                  test -n "$clang_release"
                  KBUILD_MODPOST_WARN=1 CC="$cc" KDIR=/tmp/linux-clang KERNEL_RELEASE="$clang_release" ./build.sh
                  stage=/tmp/dniv-stage-clang
                  rm -rf "$stage"
                  DESTDIR="$stage" KERNEL_RELEASE="$clang_release" ./install.sh
                  test -s "$stage/usr/local/bin/ncp"
                  test -s "$stage/usr/local/sbin/dnctl"
                  test -s "$stage/usr/local/lib/libdnet.so.1.0"
                  test -s "$stage/lib/modules/$clang_release/extra/decnet_iv.ko"
                  DESTDIR="$stage" KERNEL_RELEASE="$clang_release" ./uninstall.sh
                else
                  CC="$cc" KDIR="$KDIR" KERNEL_RELEASE="$kernel_release" ./build.sh
                  stage=/tmp/dniv-stage
                  rm -rf "$stage"
                  DESTDIR="$stage" KERNEL_RELEASE="$kernel_release" ./install.sh
                  test -s "$stage/usr/local/bin/ncp"
                  test -s "$stage/usr/local/sbin/dnctl"
                  test -s "$stage/usr/local/lib/libdnet.so.1.0"
                  test -s "$stage/lib/modules/$kernel_release/extra/decnet_iv.ko"
                  DESTDIR="$stage" KERNEL_RELEASE="$kernel_release" ./uninstall.sh

                  if [[ "$DNIV_DISTRO" == debian13 ]]; then
                    linux_floor_repo=https://github.com/torvalds/linux.git
                    linux_floor_commit=e8f897f4afef0031fe618a8e94127a0934896aba
                    rm -rf /tmp/linux-floor
                    git -C /tmp init -q linux-floor
                    git -C /tmp/linux-floor remote add origin "$linux_floor_repo"
                    git -C /tmp/linux-floor fetch --depth=1 origin "$linux_floor_commit"
                    git -C /tmp/linux-floor checkout -q --detach FETCH_HEAD
                    test "$(git -C /tmp/linux-floor rev-parse HEAD)" = "$linux_floor_commit"
                    rm -rf /tmp/linux-floor/.git
                    make -C /tmp/linux-floor defconfig >/dev/null
                    /tmp/linux-floor/scripts/config --file /tmp/linux-floor/.config --enable MODULES
                    /tmp/linux-floor/scripts/config --file /tmp/linux-floor/.config --disable MODVERSIONS
                    /tmp/linux-floor/scripts/config --file /tmp/linux-floor/.config --disable MODULE_SIG_ALL
                    /tmp/linux-floor/scripts/config --file /tmp/linux-floor/.config --disable MODULE_SIG_FORCE
                    make -C /tmp/linux-floor olddefconfig >/dev/null
                    make -C /tmp/linux-floor modules_prepare -j2 >/dev/null
                    floor_release=$(cat /tmp/linux-floor/include/config/kernel.release)
                    test "$floor_release" = 6.8.0
                    KBUILD_MODPOST_WARN=1 CC="$cc" KDIR=/tmp/linux-floor KERNEL_RELEASE="$floor_release" ./build.sh
                    floor_stage=/tmp/dniv-stage-floor
                    rm -rf "$floor_stage"
                    DESTDIR="$floor_stage" KERNEL_RELEASE="$floor_release" ./install.sh
                    test -s "$floor_stage/usr/local/bin/ncp"
                    test -s "$floor_stage/usr/local/sbin/dnctl"
                    test -s "$floor_stage/usr/local/lib/libdnet.so.1.0"
                    test -s "$floor_stage/lib/modules/$floor_release/extra/decnet_iv.ko"
                    DESTDIR="$floor_stage" KERNEL_RELEASE="$floor_release" ./uninstall.sh
                  fi
                fi
              ' 2>&1 | tee "$log"
          }

          run_case debian13 debian:13 gcc
          run_case debian13 debian:13 clang
          run_case fedora44 fedora:44 gcc
          run_case fedora44 fedora:44 clang

      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final \
            --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json" \
            --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Preserve portability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-portability-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false

