name: Source Release Reproducibility

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        required: false
        type: string
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  package-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/source-release-amd64
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR"             --workflow source-release --job source-release --arch amd64             --mode reproducibility --source-sha "$candidate"             --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main
      - name: Install source build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential linux-headers-generic python3 kmod xz-utils
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$KDIR"
          KERNEL_RELEASE=$(basename "$KDIR")
          KERNEL_RELEASE=${KERNEL_RELEASE#linux-headers-}
          printf 'KDIR=%s\nKERNEL_RELEASE=%s\n' "$KDIR" "$KERNEL_RELEASE" >>"$GITHUB_ENV"
      - name: Build source archive twice
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-ci-${GITHUB_SHA:0:12}"
          mkdir -p "$DNIV_SCRATCH_DIR/a" "$DNIV_SCRATCH_DIR/b" "$DNIV_SCRATCH_DIR/release"
          a=$(tools/build-source-release.sh "$DNIV_SCRATCH_DIR/a" "$version" "$GITHUB_SHA")
          b=$(tools/build-source-release.sh "$DNIV_SCRATCH_DIR/b" "$version" "$GITHUB_SHA")
          cmp "$a" "$b"
          (
            cd "$DNIV_SCRATCH_DIR"
            relative=$("$GITHUB_WORKSPACE/tools/build-source-release.sh" relative "$version" "$GITHUB_SHA")
            cmp "$a" "$relative"
          )
          cp "$a" "$DNIV_SCRATCH_DIR/release/"
          cp "$a.sha256" "$DNIV_SCRATCH_DIR/release/"
          basename "$a" >"$DNIV_SCRATCH_DIR/release/archive-name.txt"
      - name: Build install and uninstall extracted source
        shell: bash
        run: |
          set -euo pipefail
          archive=$(cat "$DNIV_SCRATCH_DIR/release/archive-name.txt")
          mkdir "$RUNNER_TEMP/src" "$RUNNER_TEMP/stage"
          tar -xJf "$DNIV_SCRATCH_DIR/release/$archive" -C "$RUNNER_TEMP/src"
          src=$(find "$RUNNER_TEMP/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$src"
          test ! -e "$src/.git"
          cd "$src"
          KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh

          fail_stage="$RUNNER_TEMP/fail-stage"
          mv userspace/dnnml/dnnml userspace/dnnml/dnnml.audit-backup
          if DESTDIR="$fail_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: missing-artifact negative unexpectedly succeeded" >&2
            exit 1
          fi
          mv userspace/dnnml/dnnml.audit-backup userspace/dnnml/dnnml
          test -s "$fail_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          DESTDIR="$fail_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          if find "$fail_stage" \( -type f -o -type l \) -print -quit | grep -q .; then
            echo "source-release: interrupted-install cleanup left tracked files" >&2
            exit 1
          fi

          conflict_stage="$RUNNER_TEMP/conflict-stage"
          mkdir -p "$conflict_stage/usr/local/bin"
          printf 'foreign-ncp\n' >"$conflict_stage/usr/local/bin/ncp"
          if DESTDIR="$conflict_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh; then
            echo "source-release: unmanaged-target negative unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fqx 'foreign-ncp' "$conflict_stage/usr/local/bin/ncp"
          test -s "$conflict_stage/usr/local/share/decnet-iv-linux/install-manifest.txt"
          DESTDIR="$conflict_stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          grep -Fqx 'foreign-ncp' "$conflict_stage/usr/local/bin/ncp"

          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          test -s "$RUNNER_TEMP/stage/usr/local/sbin/dnctl"
          test -s "$RUNNER_TEMP/stage/usr/local/bin/ncp"
          test -s "$RUNNER_TEMP/stage/usr/local/lib/libdnet.so.1.0"
          test -s "$RUNNER_TEMP/stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
          test ! -e "$RUNNER_TEMP/stage/usr/local/sbin/dnctl"
          test ! -e "$RUNNER_TEMP/stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final             --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json"             --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"
      - name: Preserve exact source release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decnet-iv-linux-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  validate-arm64:
    needs: package-amd64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/source-release-arm64
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR"             --workflow source-release --job source-release --arch arm64             --mode extracted-source --source-sha "$candidate"             --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main
      - name: Download exact source release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decnet-iv-linux-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Install source build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential linux-headers-generic python3 kmod xz-utils
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$KDIR"
          KERNEL_RELEASE=$(basename "$KDIR")
          KERNEL_RELEASE=${KERNEL_RELEASE#linux-headers-}
          printf 'KDIR=%s\nKERNEL_RELEASE=%s\n' "$KDIR" "$KERNEL_RELEASE" >>"$GITHUB_ENV"
      - name: Validate build install and uninstall
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'DECnet-IV-Linux-*.tar.xz' -print -quit)
          test -n "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          mkdir "$RUNNER_TEMP/src" "$RUNNER_TEMP/stage"
          tar -xJf "$archive" -C "$RUNNER_TEMP/src"
          src=$(find "$RUNNER_TEMP/src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test ! -e "$src/.git"
          grep -Fqx "source_sha=$GITHUB_SHA" "$src/SOURCE-METADATA"
          cd "$src"
          KDIR="$KDIR" KERNEL_RELEASE="$KERNEL_RELEASE" ./build.sh
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./install.sh
          test -s "$RUNNER_TEMP/stage/usr/local/sbin/dnctl"
          test -s "$RUNNER_TEMP/stage/usr/local/bin/ncp"
          test -s "$RUNNER_TEMP/stage/usr/local/lib/libdnet.so.1.0"
          test -s "$RUNNER_TEMP/stage/lib/modules/$KERNEL_RELEASE/extra/decnet_iv.ko"
          DESTDIR="$RUNNER_TEMP/stage" KERNEL_RELEASE="$KERNEL_RELEASE" ./uninstall.sh
      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final             --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json"             --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"
      - name: Preserve arm64 source-release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-evidence-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
