name: Build Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Native builds on both required CPU architectures catch ABI and compiler assumptions early.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            slot: x64
          - runner: ubuntu-24.04-arm
            slot: arm64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: dniv-runner-${{ matrix.slot }}
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Generic headers are sufficient for the bootstrap compile gate; image CI later builds against the exact selected image kernel.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic

      - name: Build userspace and run unit tests
        run: make all

      - name: Build kernel module
        run: |
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$KDIR"
          make kernel KDIR="$KDIR"
