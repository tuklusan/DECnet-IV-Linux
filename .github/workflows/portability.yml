name: Distro Portability

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        required: false
        type: string
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  portability:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, distro: debian13, image: "debian:13", compiler: gcc}
          - {runner: ubuntu-24.04, arch: amd64, distro: debian13, image: "debian:13", compiler: clang}
          - {runner: ubuntu-24.04-arm, arch: arm64, distro: debian13, image: "debian:13", compiler: gcc}
          - {runner: ubuntu-24.04-arm, arch: arm64, distro: debian13, image: "debian:13", compiler: clang}
          - {runner: ubuntu-24.04, arch: amd64, distro: fedora42, image: "fedora:42", compiler: gcc}
          - {runner: ubuntu-24.04, arch: amd64, distro: fedora42, image: "fedora:42", compiler: clang}
          - {runner: ubuntu-24.04-arm, arch: arm64, distro: fedora42, image: "fedora:42", compiler: gcc}
          - {runner: ubuntu-24.04-arm, arch: arm64, distro: fedora42, image: "fedora:42", compiler: clang}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/portability-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.compiler }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR"             --workflow portability --job "${{ matrix.distro }}-${{ matrix.compiler }}" --arch '${{ matrix.arch }}'             --mode '${{ matrix.distro }}-${{ matrix.compiler }}' --source-sha "$candidate"             --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main

      - name: Build exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DNIV_SCRATCH_DIR/source"
          version="0.0.0-ci-${GITHUB_SHA:0:12}"
          tools/build-source-release.sh "$DNIV_SCRATCH_DIR/source" "$version" "$GITHUB_SHA" >/dev/null

      - name: Build and test extracted source in distro container
        shell: bash
        run: |
          set -euo pipefail
          image='${{ matrix.image }}'
          distro='${{ matrix.distro }}'
          arch='${{ matrix.arch }}'
          compiler='${{ matrix.compiler }}'
          source_dir="$DNIV_SCRATCH_DIR/source"
          archive=$(find "$source_dir" -maxdepth 1 -name 'DECnet-IV-Linux-*.tar.xz' -print -quit)
          test -n "$archive"
          test -s "$archive.sha256"
          docker pull "$image"
          docker run --rm \
            -e DNIV_DISTRO="$distro" \
            -e DNIV_ARCH="$arch" \
            -e DNIV_COMPILER="$compiler" \
            -e DNIV_EXPECTED_SHA="$GITHUB_SHA" \
            -v "$source_dir:/release:ro" \
            "$image" bash -ceu '
              if [[ "$DNIV_DISTRO" == debian13 ]]; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                if [[ "$DNIV_ARCH" == amd64 ]]; then kh=linux-headers-amd64; else kh=linux-headers-arm64; fi
                apt-get install -y build-essential clang llvm lld python3 kmod xz-utils git bc bison flex libelf-dev libssl-dev "$kh"
                KDIR=$(find /usr/src -maxdepth 1 -type d -name "linux-headers-*" ! -name "*-common" | sort -V | tail -1)
              else
                dnf -y install gcc clang llvm lld make python3 kmod kernel-devel findutils git                   bc bison flex elfutils-libelf-devel openssl-devel perl curl xz tar
                KDIR=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
              fi
              test -n "$KDIR"
              archive=$(find /release -maxdepth 1 -name "DECnet-IV-Linux-*.tar.xz" -print -quit)
              test -n "$archive"
              (cd /release && sha256sum -c "$(basename "$archive").sha256")
              mkdir /src
              tar -xJf "$archive" -C /src --strip-components=1
              cd /src
              test ! -e .git
              grep -Fqx "source_sha=$DNIV_EXPECTED_SHA" SOURCE-METADATA
              case "$DNIV_COMPILER" in gcc) cc=gcc ;; clang) cc=clang ;; *) exit 2 ;; esac
              "$cc" --version | head -1
              make clean KDIR="$KDIR" >/dev/null 2>&1 || true
              make all CC="$cc"
              if [[ -r "$KDIR/include/config/kernel.release" ]]; then
                kernel_release=$(cat "$KDIR/include/config/kernel.release")
              else
                kernel_release=$(basename "$KDIR")
                kernel_release=${kernel_release#linux-headers-}
              fi
              if [[ "$DNIV_COMPILER" == clang ]]; then
                linux_repo=$(sed -n 's/^linux_repo=//p' tests/lab/build-diagnostic-kernel.sh)
                linux_commit=$(sed -n 's/^linux_commit=//p' tests/lab/build-diagnostic-kernel.sh)
                test -n "$linux_repo"
                test -n "$linux_commit"
                rm -rf /tmp/linux-clang
                git -C /tmp init -q linux-clang
                git -C /tmp/linux-clang remote add origin "$linux_repo"
                git -C /tmp/linux-clang fetch --depth=1 origin "$linux_commit"
                git -C /tmp/linux-clang checkout -q --detach FETCH_HEAD
                test "$(git -C /tmp/linux-clang rev-parse HEAD)" = "$linux_commit"
                rm -rf /tmp/linux-clang/.git
                LLVM=1 make -C /tmp/linux-clang defconfig >/dev/null
                LLVM=1 make -C /tmp/linux-clang modules_prepare -j2 >/dev/null
                LLVM=1 make -C /tmp/linux-clang M="$PWD/kernel/decnet" decnet_iv.o
                test -s kernel/decnet/decnet_iv.o
              else
                make kernel KDIR="$KDIR" CC="$cc"
              fi
              if [[ -s kernel/decnet/decnet_iv.ko ]]; then
                stage=/tmp/dniv-stage
                DESTDIR="$stage" KERNEL_RELEASE="$kernel_release" ./install.sh
                test -s "$stage/usr/local/bin/ncp"
                test -s "$stage/usr/local/sbin/dnctl"
                test -s "$stage/usr/local/lib/libdnet.so.1.0"
                test -s "$stage/lib/modules/$kernel_release/extra/decnet_iv.ko"
                DESTDIR="$stage" KERNEL_RELEASE="$kernel_release" ./uninstall.sh
              fi
            ' 2>&1 | tee "$DNIV_SCRATCH_DIR/portability.log"

      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final             --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json"             --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Preserve evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-portability-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
