name: Distro Portability

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        required: false
        type: string
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  portability:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            distro: debian13
            image: debian:13
            compiler: gcc
          - runner: ubuntu-24.04
            arch: amd64
            distro: debian13
            image: debian:13
            compiler: clang
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: debian13
            image: debian:13
            compiler: gcc
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: debian13
            image: debian:13
            compiler: clang
          - runner: ubuntu-24.04
            arch: amd64
            distro: fedora42
            image: fedora:42
            compiler: gcc
          - runner: ubuntu-24.04
            arch: amd64
            distro: fedora42
            image: fedora:42
            compiler: clang
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: fedora42
            image: fedora:42
            compiler: gcc
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: fedora42
            image: fedora:42
            compiler: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/portability-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.compiler }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR" \
            --workflow portability --job "${{ matrix.distro }}-${{ matrix.compiler }}" --arch '${{ matrix.arch }}' \
            --mode '${{ matrix.distro }}-${{ matrix.compiler }}' --source-sha "$candidate" \
            --parent-run-id '${{ inputs.parent_run_id }}' --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main

      - name: Build and test in distro container
        shell: bash
        run: |
          set -euo pipefail
          image='${{ matrix.image }}'
          distro='${{ matrix.distro }}'
          arch='${{ matrix.arch }}'
          compiler='${{ matrix.compiler }}'
          docker pull "$image"
          docker run --rm \
            -e DNIV_DISTRO="$distro" -e DNIV_ARCH="$arch" -e DNIV_COMPILER="$compiler" \
            -v "$PWD:/src" -w /src "$image" bash -ceu '
              if [[ "$DNIV_DISTRO" == debian13 ]]; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                if [[ "$DNIV_ARCH" == amd64 ]]; then kh=linux-headers-amd64; else kh=linux-headers-arm64; fi
                apt-get install -y build-essential clang llvm lld python3 "$kh"
                KDIR=$(find /usr/src -maxdepth 1 -type d -name "linux-headers-*" ! -name "*-common" | sort -V | tail -1)
              else
                dnf -y install gcc clang llvm lld make python3 kernel-devel findutils \
                  bc bison flex elfutils-libelf-devel openssl-devel perl curl xz
                KDIR=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
              fi
              test -n "$KDIR"
              case "$DNIV_COMPILER" in gcc) cc=gcc ;; clang) cc=clang ;; *) exit 2 ;; esac
              "$cc" --version | head -1
              make clean KDIR="$KDIR" >/dev/null 2>&1 || true
              make all CC="$cc"
              if [[ "$DNIV_COMPILER" == clang && "$DNIV_DISTRO" == fedora42 ]]; then
                # Fedora's shipped kernel-devel tree is configured for GCC and
                # therefore carries GCC-only KBUILD_CFLAGS.  Validate the exact
                # Fedora kernel ABI/API in the paired GCC job, and validate this
                # module with Clang against the same upstream kernel base version
                # using a compiler-native prepared tree.
                kver=$(basename "$KDIR")
                kbase=${kver%%-*}
                case "$kbase" in
                  [0-9]*.[0-9]*.[0-9]*) ;;
                  *) echo "bad Fedora kernel base version: $kbase" >&2; exit 2 ;;
                esac
                curl -fsSLo /tmp/linux.tar.xz \
                  "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${kbase}.tar.xz"
                tar -C /tmp -xf /tmp/linux.tar.xz
                LLVM=1 make -C "/tmp/linux-${kbase}" defconfig >/dev/null
                LLVM=1 make -C "/tmp/linux-${kbase}" modules_prepare -j2 >/dev/null
                make kernel KDIR="/tmp/linux-${kbase}" LLVM=1
              elif [[ "$DNIV_COMPILER" == clang ]]; then
                make kernel KDIR="$KDIR" LLVM=1
              else
                make kernel KDIR="$KDIR" CC="$cc"
              fi
            ' 2>&1 | tee "$DNIV_SCRATCH_DIR/portability.log"

      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final \
            --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json" \
            --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Preserve evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-portability-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.run_id }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          overwrite: true
