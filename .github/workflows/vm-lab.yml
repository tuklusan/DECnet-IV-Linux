name: Two-Node VM Lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-node-x86:
    runs-on: ubuntu-24.04
    env:
      DNIV_LAB_ARTIFACTS: ${{ github.workspace }}/tests/lab/artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This gate boots two separate Alpine guests and proves raw DECnet Ethernet frames reach our module.
      # It intentionally does not claim hello, adjacency or routing protocol conformance yet.
      - name: Install VM lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libguestfs-tools tcpdump curl

      - name: Download and verify pinned Alpine image
        run: |
          set -eu
          . image/alpine/images.env
          cd "$RUNNER_TEMP"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_X86_64_IMAGE"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_X86_64_IMAGE.sha512"
          python3 "$GITHUB_WORKSPACE/tools/verify_sha512.py" \
            "$ALPINE_X86_64_IMAGE" "$ALPINE_X86_64_IMAGE.sha512"
          echo "ALPINE_X86_IMAGE=$RUNNER_TEMP/$ALPINE_X86_64_IMAGE" >> "$GITHUB_ENV"

      - name: Run DN70 and DN71 Ethernet smoke test
        run: tests/lab/run-two-node-x86.sh "$ALPINE_X86_IMAGE"

      - name: Retain serial logs and packet capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-node-x86-lab
          path: |
            tests/lab/artifacts/*.serial.log
            tests/lab/artifacts/*.pcap
          if-no-files-found: warn

  pinned-arm-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ARM execution is the next lab slice; this gate already prevents its pinned base from disappearing or changing unnoticed.
      - name: Verify pinned aarch64 Alpine image
        run: |
          set -eu
          . image/alpine/images.env
          cd "$RUNNER_TEMP"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_AARCH64_IMAGE"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_AARCH64_IMAGE.sha512"
          python3 "$GITHUB_WORKSPACE/tools/verify_sha512.py" \
            "$ALPINE_AARCH64_IMAGE" "$ALPINE_AARCH64_IMAGE.sha512"
