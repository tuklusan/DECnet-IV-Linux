name: Python QEMU VM Lab

on:
  workflow_dispatch:
    inputs:
      lab_mode:
        description: Acceptance mode to run
        required: true
        default: phase2
        type: choice
        options:
          - phase2
          - e1
      parent_run_id:
        description: Parent acceptance workflow run ID; blank for direct dispatch
        required: false
        type: string
      expected_sha:
        description: Exact parent candidate SHA; blank for direct dispatch
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python-two-node:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            slot: x64
            arch: amd64
            qemu: qemu-system-x86
          - runner: ubuntu-24.04-arm
            slot: arm64
            arch: arm64
            qemu: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: dniv-runner-${{ matrix.slot }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}-${{ matrix.arch }}
      DNIV_LAB_MODE: ${{ inputs.lab_mode }}
      DNIV_LAB_TIMEOUT_SECONDS: 300
      DNIV_LAB_SESSION_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-${{ inputs.lab_mode }}
      DNIV_LAB_ARCH: ${{ matrix.arch }}
      DNIV_LAB_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Initialize scratch state and verify integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR" \
            --workflow vm-lab --job "$GITHUB_JOB" --arch '${{ matrix.arch }}' \
            --mode '${{ inputs.lab_mode }}' --source-sha "$GITHUB_SHA" \
            --parent-run-id '${{ inputs.parent_run_id }}' \
            --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$GITHUB_SHA" main
          echo "DNIV_LAB_ARTIFACTS=$DNIV_SCRATCH_DIR/lab" >> "$GITHUB_ENV"

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$DNIV_SCRATCH_DIR/apt-update.log"
          sudo apt-get install -y ${{ matrix.qemu }} qemu-utils e2fsprogs tcpdump curl 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/apt-install.log"

      - name: Download and verify pinned Ubuntu Base rootfs
        shell: bash
        run: |
          set -euo pipefail
          . image/ubuntu-base/images.env
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            file=$UBUNTU_BASE_AMD64
            sha=$UBUNTU_BASE_AMD64_SHA256
          else
            file=$UBUNTU_BASE_ARM64
            sha=$UBUNTU_BASE_ARM64_SHA256
          fi
          curl -fL "$UBUNTU_BASE_URL/$file" -o "$RUNNER_TEMP/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          echo "UBUNTU_BASE_TARBALL=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"

      - name: Build immutable DECnet test base
        shell: bash
        run: |
          set -euo pipefail
          sudo -v
          image/ubuntu-base/build-image.sh '${{ matrix.arch }}' "$UBUNTU_BASE_TARBALL" \
            "$RUNNER_TEMP/dniv-${{ matrix.arch }}.qcow2" "$RUNNER_TEMP/boot-${{ matrix.arch }}" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/build-image.log"
          echo "DNIV_LAB_BASE=$RUNNER_TEMP/dniv-${{ matrix.arch }}.qcow2" >> "$GITHUB_ENV"
          echo "DNIV_LAB_KERNEL=$RUNNER_TEMP/boot-${{ matrix.arch }}/vmlinuz" >> "$GITHUB_ENV"
          echo "DNIV_LAB_INITRD=$RUNNER_TEMP/boot-${{ matrix.arch }}/initrd.img" >> "$GITHUB_ENV"

      - name: Run Python QEMU overlay lab
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/lab/dniv_lab.py "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" "$DNIV_LAB_INITRD" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/two-node.log"

      - name: Verify exact tree after VM gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final \
            --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json" \
            --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Record workflow result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$DNIV_SCRATCH_DIR/state.json" ]]; then
            python3 tools/scratch_state.py mark --dir "$DNIV_SCRATCH_DIR" \
              --status '${{ job.status }}' --note 'Python QEMU VM workflow completed'
          fi

      - name: Preserve compact VM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-vm-lab-evidence-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.DNIV_SCRATCH_DIR }}/
            !${{ env.DNIV_SCRATCH_DIR }}/lab/**/*.qcow2
            !${{ env.DNIV_SCRATCH_DIR }}/lab/**/*.qmp
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          overwrite: true
