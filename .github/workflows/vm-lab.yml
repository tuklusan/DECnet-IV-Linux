name: Python QEMU VM Lab

on:
  workflow_dispatch:
    inputs:
      lab_mode:
        description: Acceptance mode to run
        required: true
        default: phase2
        type: choice
        options:
          - phase2
          - e1
          - e2
          - e3
          - e4
      parent_run_id:
        description: Parent acceptance workflow run ID; blank for direct dispatch
        required: false
        type: string
      expected_sha:
        description: Exact parent candidate SHA; blank for direct dispatch
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.lab_mode }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python-two-node:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            slot: x64
            arch: amd64
            qemu: qemu-system-x86
            lab_timeout: 300
          - runner: ubuntu-24.04-arm
            slot: arm64
            arch: arm64
            qemu: qemu-system-arm
            lab_timeout: 375
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: dniv-vm-${{ github.run_id }}-${{ matrix.slot }}-${{ inputs.lab_mode }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}-${{ matrix.arch }}
      DNIV_LAB_MODE: ${{ inputs.lab_mode }}
      DNIV_LAB_TIMEOUT_SECONDS: ${{ matrix.lab_timeout }}
      DNIV_LAB_SESSION_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-${{ inputs.lab_mode }}
      DNIV_LAB_ARCH: ${{ matrix.arch }}
      DNIV_LAB_SOURCE_SHA: ${{ github.sha }}
      DNIV_OUTER_BASE_DIR: ${{ github.workspace }}/scratch/outer/${{ matrix.arch }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Initialize scratch state and verify integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR" \
            --workflow vm-lab --job "$GITHUB_JOB" --arch '${{ matrix.arch }}' \
            --mode '${{ inputs.lab_mode }}' --source-sha "$GITHUB_SHA" \
            --parent-run-id '${{ inputs.parent_run_id }}' \
            --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$GITHUB_SHA" main
          echo "DNIV_LAB_ARTIFACTS=/tmp/dniv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$DNIV_SCRATCH_DIR/apt-update.log"
          sudo apt-get install -y ${{ matrix.qemu }} qemu-utils e2fsprogs tcpdump curl 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/apt-install.log"

      - name: Compute stable architecture foundation identity
        id: foundation-id
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(cat image/ubuntu-base/images.env image/ubuntu-base/build-foundation.sh | \
            sha256sum | cut -c1-16)
          session="outer-v2-${{ matrix.arch }}-$fingerprint"
          echo "DNIV_FOUNDATION_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "DNIV_OUTER_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "session_id=$session" >> "$GITHUB_OUTPUT"

      - name: Restore immutable outer architecture foundation
        id: outer-base
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Download pinned Ubuntu Base rootfs on foundation miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          . image/ubuntu-base/images.env
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            file=$UBUNTU_BASE_AMD64
            sha=$UBUNTU_BASE_AMD64_SHA256
          else
            file=$UBUNTU_BASE_ARM64
            sha=$UBUNTU_BASE_ARM64_SHA256
          fi
          curl -fL "$UBUNTU_BASE_URL/$file" -o "$RUNNER_TEMP/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          echo "UBUNTU_BASE_TARBALL=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"

      - name: Build immutable outer architecture foundation on cache miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -v
          rm -rf "$DNIV_OUTER_BASE_DIR"
          mkdir -p "$DNIV_OUTER_BASE_DIR/boot"
          image/ubuntu-base/build-foundation.sh '${{ matrix.arch }}' "$UBUNTU_BASE_TARBALL" \
            "$DNIV_OUTER_BASE_DIR/base.qcow2" "$DNIV_OUTER_BASE_DIR/boot" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/build-foundation.log"
          . image/ubuntu-base/images.env
          cat > "$DNIV_OUTER_BASE_DIR/session.env" <<EOF_SESSION
          FORMAT=2
          SESSION_ID=$DNIV_OUTER_SESSION_ID
          ARCH=${{ matrix.arch }}
          FOUNDATION_FINGERPRINT=$DNIV_FOUNDATION_FINGERPRINT
          UBUNTU_BASE_RELEASE=$UBUNTU_BASE_RELEASE
          UBUNTU_APT_SNAPSHOT=$UBUNTU_APT_SNAPSHOT
          EOF_SESSION
          (
            cd "$DNIV_OUTER_BASE_DIR"
            sha256sum base.qcow2 boot/vmlinuz boot/initrd.img session.env > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          qemu-img check -q -f qcow2 "$DNIV_OUTER_BASE_DIR/base.qcow2"

      - name: Save immutable outer architecture foundation
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Verify source-independent architecture foundation
        shell: bash
        run: |
          set -euo pipefail
          . image/ubuntu-base/images.env
          test -f "$DNIV_OUTER_BASE_DIR/session.env"
          test -f "$DNIV_OUTER_BASE_DIR/SHA256SUMS"
          grep -Fx 'FORMAT=2' "$DNIV_OUTER_BASE_DIR/session.env"
          grep -Fx "SESSION_ID=$DNIV_OUTER_SESSION_ID" "$DNIV_OUTER_BASE_DIR/session.env"
          grep -Fx 'ARCH=${{ matrix.arch }}' "$DNIV_OUTER_BASE_DIR/session.env"
          grep -Fx "FOUNDATION_FINGERPRINT=$DNIV_FOUNDATION_FINGERPRINT" "$DNIV_OUTER_BASE_DIR/session.env"
          grep -Fx "UBUNTU_BASE_RELEASE=$UBUNTU_BASE_RELEASE" "$DNIV_OUTER_BASE_DIR/session.env"
          grep -Fx "UBUNTU_APT_SNAPSHOT=$UBUNTU_APT_SNAPSHOT" "$DNIV_OUTER_BASE_DIR/session.env"
          ! grep -q '^SOURCE_SHA=' "$DNIV_OUTER_BASE_DIR/session.env"
          (
            cd "$DNIV_OUTER_BASE_DIR"
            sha256sum -c SHA256SUMS
          )
          qemu-img check -q -f qcow2 "$DNIV_OUTER_BASE_DIR/base.qcow2"
          cp "$DNIV_OUTER_BASE_DIR/session.env" "$DNIV_SCRATCH_DIR/outer-session.env"
          printf 'CACHE_HIT=%s\n' '${{ steps.outer-base.outputs.cache-hit }}' >> \
            "$DNIV_SCRATCH_DIR/outer-session.env"
          echo "DNIV_OUTER_BASE=$DNIV_OUTER_BASE_DIR/base.qcow2" >> "$GITHUB_ENV"
          echo "DNIV_LAB_KERNEL=$DNIV_OUTER_BASE_DIR/boot/vmlinuz" >> "$GITHUB_ENV"
          echo "DNIV_LAB_INITRD=$DNIV_OUTER_BASE_DIR/boot/initrd.img" >> "$GITHUB_ENV"

      - name: Inject exact candidate into disposable image
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate-${{ matrix.arch }}.qcow2"
          tests/lab/prepare-candidate-image.sh "$DNIV_OUTER_BASE" "$candidate" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/prepare-candidate.log"
          echo "DNIV_LAB_BASE=$candidate" >> "$GITHUB_ENV"

      - name: Run Python QEMU overlay lab
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$DNIV_LAB_ARTIFACTS"
          set +e
          if [[ "${DNIV_LAB_MODE}" == e2 ]]; then
            python3 tests/lab/dniv_e2.py "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" "$DNIV_LAB_INITRD" 2>&1 | \
              tee "$DNIV_SCRATCH_DIR/two-node.log"
          elif [[ "${DNIV_LAB_MODE}" == e3 ]]; then
            python3 tests/lab/dniv_e3.py "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" "$DNIV_LAB_INITRD" 2>&1 | \
              tee "$DNIV_SCRATCH_DIR/two-node.log"
          elif [[ "${DNIV_LAB_MODE}" == e4 ]]; then
            python3 tests/lab/dniv_e4.py "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" "$DNIV_LAB_INITRD" 2>&1 | \
              tee "$DNIV_SCRATCH_DIR/two-node.log"
          else
            python3 tests/lab/dniv_lab.py "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" "$DNIV_LAB_INITRD" 2>&1 | \
              tee "$DNIV_SCRATCH_DIR/two-node.log"
          fi
          rc=${PIPESTATUS[0]}
          set -e
          if [[ -d "$DNIV_LAB_ARTIFACTS" ]]; then
            mkdir -p "$DNIV_SCRATCH_DIR/lab"
            cp -a "$DNIV_LAB_ARTIFACTS/." "$DNIV_SCRATCH_DIR/lab/"
            find "$DNIV_SCRATCH_DIR/lab" -type f \( -name '*.qcow2' -o -name '*.qmp' \) -delete
          fi
          rm -rf "$DNIV_LAB_ARTIFACTS"
          exit "$rc"

      - name: Verify exact tree after VM gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final \
            --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json" \
            --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Record workflow result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$DNIV_SCRATCH_DIR/state.json" ]]; then
            python3 tools/scratch_state.py mark --dir "$DNIV_SCRATCH_DIR" \
              --status '${{ job.status }}' --note 'Python QEMU VM workflow completed'
          fi

      - name: Preserve compact VM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-vm-lab-evidence-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ env.DNIV_SCRATCH_DIR }}/
            !${{ env.DNIV_SCRATCH_DIR }}/lab/**/*.qcow2
            !${{ env.DNIV_SCRATCH_DIR }}/lab/**/*.qmp
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          overwrite: true
