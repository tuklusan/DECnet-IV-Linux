name: Two-Node VM Lab

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lab_session_id:
        description: Stable lab session ID; blank creates one from the workflow run ID
        required: false
        type: string
      resume_run_id:
        description: Prior workflow run ID whose saved VM session should be restored
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  two-node-x86:
    runs-on: ubuntu-24.04
    env:
      DNIV_LAB_ARTIFACTS: ${{ github.workspace }}/tests/lab/artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize lab session
        id: session
        shell: bash
        run: |
          set -euo pipefail
          session='${{ inputs.lab_session_id }}'
          resume_run='${{ inputs.resume_run_id }}'
          if [[ -z "$session" ]]; then
            if [[ -n "$resume_run" ]]; then
              session="gha-${resume_run}"
            else
              session="gha-${GITHUB_RUN_ID}"
            fi
          fi
          attempt="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -n "$resume_run" ]]; then
            resume=1
          else
            resume=0
          fi
          echo "DNIV_LAB_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "DNIV_LAB_ATTEMPT_ID=$attempt" >> "$GITHUB_ENV"
          echo "DNIV_LAB_RESUME=$resume" >> "$GITHUB_ENV"
          echo "session_id=$session" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "lab session=$session attempt=$attempt resume=$resume"

      # A prior session artifact contains the stateful qcow2 disks, seeds and manifests.
      - name: Restore prior VM session
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: two-node-x86-session-${{ steps.session.outputs.session_id }}
          path: tests/lab/artifacts/sessions/${{ steps.session.outputs.session_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      # NoCloud provisions each guest; the DECnet data NIC stays on an isolated bridge.
      - name: Install VM lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils tcpdump curl genisoimage

      - name: Download and verify pinned Alpine image
        run: |
          set -eu
          . image/alpine/images.env
          cd "$RUNNER_TEMP"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_X86_64_IMAGE"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_X86_64_IMAGE.sha512"
          python3 "$GITHUB_WORKSPACE/tools/verify_sha512.py" \
            "$ALPINE_X86_64_IMAGE" "$ALPINE_X86_64_IMAGE.sha512"
          echo "ALPINE_X86_IMAGE=$RUNNER_TEMP/$ALPINE_X86_64_IMAGE" >> "$GITHUB_ENV"

      # Guests must load the AKMS-managed module and exchange native EtherType 0x6003 traffic.
      - name: Run DN70 and DN71 Ethernet smoke test
        run: tests/lab/run-two-node-x86.sh "$ALPINE_X86_IMAGE"

      - name: Retain resumable VM session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-node-x86-session-${{ steps.session.outputs.session_id }}
          path: tests/lab/artifacts/sessions/${{ steps.session.outputs.session_id }}
          if-no-files-found: warn
          overwrite: true
          compression-level: 1
          retention-days: 30

  pinned-arm-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ARM execution follows after x86 is green; this gate keeps its base immutable meanwhile.
      - name: Verify pinned aarch64 Alpine image
        run: |
          set -eu
          . image/alpine/images.env
          cd "$RUNNER_TEMP"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_AARCH64_IMAGE"
          curl -fLO "$ALPINE_BASE_URL/$ALPINE_AARCH64_IMAGE.sha512"
          python3 "$GITHUB_WORKSPACE/tools/verify_sha512.py" \
            "$ALPINE_AARCH64_IMAGE" "$ALPINE_AARCH64_IMAGE.sha512"
