name: Temporary Phase 4 Tagger

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase4-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create exact Phase 4 completion tag
        shell: bash
        run: |
          set -euo pipefail
          target='571333bfd7aaa8b2fcc88715c1d61442af151f3c'
          tag='PHASE-4-COMPLETE'
          git cat-file -e "$target^{commit}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            test "$existing" = "$target"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$target" -m 'Phase 4 complete'
          git push origin "refs/tags/$tag"
