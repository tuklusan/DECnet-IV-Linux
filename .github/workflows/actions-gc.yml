name: Actions History Garbage Collection

on:
  issues:
    types: [opened]
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

concurrency:
  group: dniv-actions-gc
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  purge:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       github.event.sender.login == github.repository_owner &&
       github.event.issue.title == 'DNIV actions cleanup')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Sweep historical Actions and caches with bounded API budget
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash tools/actions_gc.sh
