name: Area-31 Interoperability

on:
  workflow_dispatch:
    inputs:
      gateway_node:
        description: Assigned disposable Area-31 DECnet address
        required: true
        type: string
      gateway_name:
        description: Assigned disposable DECnet gateway name
        required: true
        default: DNIV31
        type: string
      linux_node:
        description: Assigned disposable Area-31 native Linux DECnet address
        required: true
        type: string
      linux_name:
        description: Assigned disposable native Linux DECnet node name
        required: true
        default: DNIV32
        type: string
      qcocal_node:
        description: Optional current Area-31 address for QCOCAL VAX HTTP proof
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dniv-area31-interop
  queue: max
  cancel-in-progress: false

jobs:
  area31:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            slot: x64
            arch: amd64
            qemu_package: qemu-system-x86
          - runner: ubuntu-24.04-arm
            slot: arm64
            arch: arm64
            qemu_package: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DNIV_OUTER_BASE_DIR: ${{ github.workspace }}/scratch/outer/${{ matrix.arch }}
      DNIV_AREA31_ARCH: ${{ matrix.arch }}
    steps:
      - name: Verify Area-31 secret prerequisites
        shell: bash
        env:
          MULTINET_REMOTE_HOST: ${{ secrets.MULTINET_REMOTE_HOST }}
          MULTINET_REMOTE_PORT: ${{ secrets.MULTINET_REMOTE_PORT }}
          VAX_ADDR: ${{ secrets.VAX_ADDR }}
          VAX_USERNAME: ${{ secrets.VAX_USERNAME }}
          VAX_PASSWORD: ${{ secrets.VAX_PASSWORD }}
        run: |
          set -euo pipefail
          required=(MULTINET_REMOTE_HOST MULTINET_REMOTE_PORT VAX_ADDR VAX_USERNAME VAX_PASSWORD)
          missing=()
          for name in "${required[@]}"; do
            value=${!name:-}
            if [[ -z "$value" ]]; then
              missing+=("$name")
            else
              printf '::add-mask::%s\n' "$value"
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'missing required Area-31 secret: %s\n' "${missing[@]}" >&2
            exit 2
          fi

      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify assigned gateway identity
        shell: bash
        env:
          DNIV_AREA31_GATEWAY_NODE: ${{ inputs.gateway_node }}
          DNIV_AREA31_GATEWAY_NAME: ${{ inputs.gateway_name }}
          DNIV_AREA31_LINUX_NODE: ${{ inputs.linux_node }}
          DNIV_AREA31_LINUX_NAME: ${{ inputs.linux_name }}
          DNIV_QCOCAL_NODE: ${{ inputs.qcocal_node }}
          MULTINET_REMOTE_HOST: ${{ secrets.MULTINET_REMOTE_HOST }}
          MULTINET_REMOTE_PORT: ${{ secrets.MULTINET_REMOTE_PORT }}
          VAX_ADDR: ${{ secrets.VAX_ADDR }}
          VAX_USERNAME: ${{ secrets.VAX_USERNAME }}
          VAX_PASSWORD: ${{ secrets.VAX_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tests/lab/prove-area31.sh --preflight-only

      - name: Install Area-31 proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv libpcap-dev vde2 libvdeplug-dev \
            ${{ matrix.qemu_package }} qemu-utils e2fsprogs curl build-essential

      - name: Compute stable amd64 foundation identity
        id: foundation-id
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(cat image/ubuntu-base/images.env image/ubuntu-base/build-foundation.sh | sha256sum | cut -c1-16)
          session="outer-v2-${{ matrix.arch }}-$fingerprint"
          echo "DNIV_FOUNDATION_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "DNIV_OUTER_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "session_id=$session" >> "$GITHUB_OUTPUT"

      - name: Restore immutable amd64 foundation
        id: outer-base
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Download pinned Ubuntu Base on foundation miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          . image/ubuntu-base/images.env
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            file=$UBUNTU_BASE_AMD64
            sha=$UBUNTU_BASE_AMD64_SHA256
          else
            file=$UBUNTU_BASE_ARM64
            sha=$UBUNTU_BASE_ARM64_SHA256
          fi
          curl -fL "$UBUNTU_BASE_URL/$file" -o "$RUNNER_TEMP/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          echo "UBUNTU_BASE_TARBALL=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"

      - name: Build immutable amd64 foundation on cache miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -v
          rm -rf "$DNIV_OUTER_BASE_DIR"
          mkdir -p "$DNIV_OUTER_BASE_DIR/boot"
          image/ubuntu-base/build-foundation.sh '${{ matrix.arch }}' "$UBUNTU_BASE_TARBALL" \
            "$DNIV_OUTER_BASE_DIR/base.qcow2" "$DNIV_OUTER_BASE_DIR/boot"
          . image/ubuntu-base/images.env
          cat >"$DNIV_OUTER_BASE_DIR/session.env" <<EOF_SESSION
          FORMAT=2
          SESSION_ID=$DNIV_OUTER_SESSION_ID
          ARCH=${{ matrix.arch }}
          FOUNDATION_FINGERPRINT=$DNIV_FOUNDATION_FINGERPRINT
          UBUNTU_BASE_RELEASE=$UBUNTU_BASE_RELEASE
          UBUNTU_APT_SNAPSHOT=$UBUNTU_APT_SNAPSHOT
          EOF_SESSION
          (cd "$DNIV_OUTER_BASE_DIR" && sha256sum base.qcow2 boot/vmlinuz boot/initrd.img session.env >SHA256SUMS)

      - name: Save immutable amd64 foundation
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Verify foundation and prepare exact candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd "$DNIV_OUTER_BASE_DIR" && sha256sum -c SHA256SUMS)
          qemu-img check -q -f qcow2 "$DNIV_OUTER_BASE_DIR/base.qcow2"
          candidate="$RUNNER_TEMP/area31-candidate-${{ matrix.arch }}.qcow2"
          tests/lab/prepare-candidate-image.sh "$DNIV_OUTER_BASE_DIR/base.qcow2" "$candidate"
          echo "DNIV_AREA31_CANDIDATE_IMAGE=$candidate" >> "$GITHUB_ENV"
          echo "DNIV_AREA31_KERNEL=$DNIV_OUTER_BASE_DIR/boot/vmlinuz" >> "$GITHUB_ENV"
          echo "DNIV_AREA31_INITRD=$DNIV_OUTER_BASE_DIR/boot/initrd.img" >> "$GITHUB_ENV"

      - name: Prove native Linux path through MULTINET to VAX
        shell: bash
        env:
          DNIV_AREA31_GATEWAY_NODE: ${{ inputs.gateway_node }}
          DNIV_AREA31_GATEWAY_NAME: ${{ inputs.gateway_name }}
          DNIV_AREA31_LINUX_NODE: ${{ inputs.linux_node }}
          DNIV_AREA31_LINUX_NAME: ${{ inputs.linux_name }}
          DNIV_QCOCAL_NODE: ${{ inputs.qcocal_node }}
          MULTINET_REMOTE_HOST: ${{ secrets.MULTINET_REMOTE_HOST }}
          MULTINET_REMOTE_PORT: ${{ secrets.MULTINET_REMOTE_PORT }}
          VAX_ADDR: ${{ secrets.VAX_ADDR }}
          VAX_USERNAME: ${{ secrets.VAX_USERNAME }}
          VAX_PASSWORD: ${{ secrets.VAX_PASSWORD }}
        run: |
          set -euo pipefail
          tests/lab/prove-area31.sh
