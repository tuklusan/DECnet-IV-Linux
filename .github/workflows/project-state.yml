name: Project State Gate

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  project-state:
    runs-on: ubuntu-latest
    concurrency:
      group: dniv-runner-x64
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify continuity record
        run: python3 tools/project_state_gate.py --head "$GITHUB_SHA"
