name: Project State Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-state:
    runs-on: ubuntu-latest
    steps:
      # Full history is required because the gate checks every commit in the pushed range.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify continuity record
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/project_state_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"
