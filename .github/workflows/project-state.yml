name: Project State Gate

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-state:
    runs-on: ubuntu-latest
    steps:
      # Full history is required because the gate checks every commit in the range.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every substantive commit must refresh the continuity record in that same commit.
      - name: Verify continuity record
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 tools/project_state_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"
