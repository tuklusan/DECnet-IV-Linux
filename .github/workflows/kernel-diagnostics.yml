name: Kernel Diagnostic E1

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Custom kernel diagnostic profile
        required: true
        default: kasan
        type: choice
        options:
          - kasan
      parent_run_id:
        description: Parent acceptance workflow run ID; blank for direct dispatch
        required: false
        type: string
      expected_sha:
        description: Exact parent candidate SHA; blank for direct dispatch
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.profile }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostic-e1:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            slot: x64
            arch: amd64
            qemu: qemu-system-x86
            vcpus: 4
            lab_timeout: 900
          - runner: ubuntu-24.04-arm
            slot: arm64
            arch: arm64
            qemu: qemu-system-arm
            vcpus: 2
            lab_timeout: 3000
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    concurrency:
      group: dniv-kdiag-${{ github.run_id }}-${{ matrix.slot }}-${{ inputs.profile }}
      queue: max
      cancel-in-progress: false
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/${{ github.job }}-${{ matrix.arch }}
      DNIV_LAB_MODE: e1
      DNIV_LAB_NIC_MODEL: virtio-net-pci
      DNIV_LAB_VCPUS: ${{ matrix.vcpus }}
      DNIV_LAB_DIAGNOSTICS: ${{ inputs.profile }}
      DNIV_LAB_MEMORY_MB: "2560"
      DNIV_LAB_TIMEOUT_SECONDS: ${{ matrix.lab_timeout }}
      DNIV_LAB_SESSION_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-${{ inputs.profile }}
      DNIV_LAB_ARCH: ${{ matrix.arch }}
      DNIV_LAB_SOURCE_SHA: ${{ github.sha }}
      DNIV_OUTER_BASE_DIR: ${{ github.workspace }}/scratch/outer/${{ matrix.arch }}
      DNIV_DIAG_DIR: ${{ github.workspace }}/scratch/diagnostic-kernel/${{ matrix.arch }}/${{ inputs.profile }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true

      - name: Initialize scratch state and verify integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR" \
            --workflow kernel-diagnostics --job "$GITHUB_JOB" --arch '${{ matrix.arch }}' \
            --mode '${{ inputs.profile }}' --source-sha "$GITHUB_SHA" \
            --parent-run-id '${{ inputs.parent_run_id }}' \
            --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$GITHUB_SHA" main
          echo "DNIV_LAB_ARTIFACTS=/tmp/dniv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}-diag" >> "$GITHUB_ENV"

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$DNIV_SCRATCH_DIR/apt-update.log"
          sudo apt-get install -y ${{ matrix.qemu }} qemu-utils e2fsprogs tcpdump curl git \
            build-essential bc bison flex libssl-dev libelf-dev cpio rsync kmod 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/apt-install.log"

      - name: Compute stable architecture foundation identity
        id: foundation-id
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(cat image/ubuntu-base/images.env image/ubuntu-base/build-foundation.sh | sha256sum | cut -c1-16)
          session="outer-v2-${{ matrix.arch }}-$fingerprint"
          echo "DNIV_FOUNDATION_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "DNIV_OUTER_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "session_id=$session" >> "$GITHUB_OUTPUT"

      - name: Restore immutable outer architecture foundation
        id: outer-base
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Download pinned Ubuntu Base rootfs on foundation miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          . image/ubuntu-base/images.env
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            file=$UBUNTU_BASE_AMD64
            sha=$UBUNTU_BASE_AMD64_SHA256
          else
            file=$UBUNTU_BASE_ARM64
            sha=$UBUNTU_BASE_ARM64_SHA256
          fi
          curl -fL "$UBUNTU_BASE_URL/$file" -o "$RUNNER_TEMP/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          echo "UBUNTU_BASE_TARBALL=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"

      - name: Build immutable outer architecture foundation on cache miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -v
          rm -rf "$DNIV_OUTER_BASE_DIR"
          mkdir -p "$DNIV_OUTER_BASE_DIR/boot"
          image/ubuntu-base/build-foundation.sh '${{ matrix.arch }}' "$UBUNTU_BASE_TARBALL" \
            "$DNIV_OUTER_BASE_DIR/base.qcow2" "$DNIV_OUTER_BASE_DIR/boot" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/build-foundation.log"
          . image/ubuntu-base/images.env
          cat > "$DNIV_OUTER_BASE_DIR/session.env" <<EOF_SESSION
          FORMAT=2
          SESSION_ID=$DNIV_OUTER_SESSION_ID
          ARCH=${{ matrix.arch }}
          FOUNDATION_FINGERPRINT=$DNIV_FOUNDATION_FINGERPRINT
          UBUNTU_BASE_RELEASE=$UBUNTU_BASE_RELEASE
          UBUNTU_APT_SNAPSHOT=$UBUNTU_APT_SNAPSHOT
          EOF_SESSION
          (
            cd "$DNIV_OUTER_BASE_DIR"
            sha256sum base.qcow2 boot/vmlinuz boot/initrd.img session.env > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          qemu-img check -q -f qcow2 "$DNIV_OUTER_BASE_DIR/base.qcow2"

      - name: Save immutable outer architecture foundation
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Verify foundation and extract production kernel config
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$DNIV_OUTER_BASE_DIR"
            sha256sum -c SHA256SUMS
          )
          qemu-img check -q -f qcow2 "$DNIV_OUTER_BASE_DIR/base.qcow2"
          raw="$RUNNER_TEMP/foundation-${{ matrix.arch }}.raw"
          mnt="$RUNNER_TEMP/foundation-${{ matrix.arch }}-mnt"
          rm -f "$raw"
          rm -rf "$mnt"
          mkdir -p "$mnt"
          qemu-img convert -q -f qcow2 -O raw "$DNIV_OUTER_BASE_DIR/base.qcow2" "$raw"
          sudo mount -o loop "$raw" "$mnt"
          config=$(find "$mnt/boot" -maxdepth 1 -type f -name 'config-*' | sort -V | tail -1)
          test -n "$config"
          sudo cp "$config" "$DNIV_SCRATCH_DIR/production-kernel.config"
          sudo chown "$(id -u):$(id -g)" "$DNIV_SCRATCH_DIR/production-kernel.config"
          sudo umount "$mnt"
          rm -f "$raw"
          grep -q '^CONFIG_MODULES=y$' "$DNIV_SCRATCH_DIR/production-kernel.config"

      - name: Compute diagnostic kernel identity
        id: diagnostic-id
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(
            {
              sha256sum tests/lab/build-diagnostic-kernel.sh
              sha256sum "$DNIV_SCRATCH_DIR/production-kernel.config"
              printf '%s\n' '${{ inputs.profile }}'
            } | sha256sum | cut -c1-20
          )
          key="dniv-kdiag-v1-${{ matrix.arch }}-${{ inputs.profile }}-$fingerprint"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          printf 'CACHE_KEY=%s\n' "$key" > "$DNIV_SCRATCH_DIR/diagnostic-kernel.env"

      - name: Restore diagnostic kernel build
        id: diagnostic-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_DIAG_DIR }}
          key: ${{ steps.diagnostic-id.outputs.key }}

      - name: Build pinned diagnostic kernel on cache miss
        if: ${{ steps.diagnostic-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tests/lab/build-diagnostic-kernel.sh '${{ matrix.arch }}' '${{ inputs.profile }}' \
            "$DNIV_SCRATCH_DIR/production-kernel.config" "$DNIV_DIAG_DIR" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/build-diagnostic-kernel.log"

      - name: Save diagnostic kernel build
        if: ${{ steps.diagnostic-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_DIAG_DIR }}
          key: ${{ steps.diagnostic-id.outputs.key }}

      - name: Verify diagnostic kernel
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DNIV_DIAG_DIR/vmlinuz"
          test -s "$DNIV_DIAG_DIR/config"
          test -s "$DNIV_DIAG_DIR/kernelrelease"
          test -d "$DNIV_DIAG_DIR/build"
          grep -q '^CONFIG_KASAN=y$' "$DNIV_DIAG_DIR/config"
          krel=$(cat "$DNIV_DIAG_DIR/kernelrelease")
          test "$krel" = "7.0.0-dniv-${{ inputs.profile }}"
          printf 'CACHE_HIT=%s\nKERNEL_RELEASE=%s\n' \
            '${{ steps.diagnostic-cache.outputs.cache-hit }}' "$krel" >> "$DNIV_SCRATCH_DIR/diagnostic-kernel.env"

      - name: Inject exact candidate into disposable image
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate-${{ matrix.arch }}-${{ inputs.profile }}.qcow2"
          tests/lab/prepare-candidate-image.sh "$DNIV_OUTER_BASE_DIR/base.qcow2" "$candidate" 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/prepare-candidate.log"
          krel=$(cat "$DNIV_DIAG_DIR/kernelrelease")
          tests/lab/install-diagnostic-module.sh "$candidate" "$DNIV_DIAG_DIR/build" "$krel" \
            "$DNIV_DIAG_DIR/config" '${{ inputs.profile }}' 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/install-diagnostic-module.log"
          echo "DNIV_LAB_BASE=$candidate" >> "$GITHUB_ENV"
          echo "DNIV_LAB_KERNEL=$DNIV_DIAG_DIR/vmlinuz" >> "$GITHUB_ENV"

      - name: Run E1 under diagnostic kernel
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$DNIV_LAB_ARTIFACTS"
          set +e
          python3 tests/lab/dniv_lab.py "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" - 2>&1 | \
            tee "$DNIV_SCRATCH_DIR/diagnostic-e1.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ -d "$DNIV_LAB_ARTIFACTS" ]]; then
            mkdir -p "$DNIV_SCRATCH_DIR/lab"
            cp -a "$DNIV_LAB_ARTIFACTS/." "$DNIV_SCRATCH_DIR/lab/"
            find "$DNIV_SCRATCH_DIR/lab" -type f \( -name '*.qcow2' -o -name '*.qmp' \) -delete
          fi
          rm -rf "$DNIV_LAB_ARTIFACTS"
          exit "$rc"

      - name: Verify exact tree after diagnostic gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final \
            --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json" \
            --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Record workflow result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$DNIV_SCRATCH_DIR/state.json" ]]; then
            python3 tools/scratch_state.py mark --dir "$DNIV_SCRATCH_DIR" \
              --status '${{ job.status }}' --note 'custom kernel diagnostic E1 completed'
          fi

      - name: Preserve compact diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-kernel-diagnostic-${{ matrix.arch }}-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            ${{ env.DNIV_SCRATCH_DIR }}/
            !${{ env.DNIV_SCRATCH_DIR }}/lab/**/*.qcow2
            !${{ env.DNIV_SCRATCH_DIR }}/lab/**/*.qmp
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          overwrite: true
