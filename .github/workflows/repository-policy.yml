name: Repository Policy

on:
  push:
  create:
  issues:
    types: [opened, edited, transferred]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    concurrency:
      group: dniv-runner-x64
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce repository policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/repo_policy.py

  dispatch-acceptance:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.title == 'DNIV acceptance gates'
    needs: repository-policy
    runs-on: ubuntu-latest
    concurrency:
      group: dniv-runner-x64
      queue: max
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch acceptance workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$head" = "$GITHUB_SHA"
          gh workflow run build.yml --ref main
          gh workflow run project-state.yml --ref main
          gh workflow run reference-baselines.yml --ref main
          gh workflow run vm-lab.yml --ref main -f lab_mode=e1
