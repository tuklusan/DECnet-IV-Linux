name: Distributed Scale16

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        required: false
        type: string
      expected_sha:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dniv-scale16-distributed-${{ github.sha }}
  queue: max
  cancel-in-progress: false

jobs:
  scale16:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            slot: x64-a
            qemu: qemu-system-x86
            side: a
          - runner: ubuntu-24.04
            arch: amd64
            slot: x64-b
            qemu: qemu-system-x86
            side: b
          - runner: ubuntu-24.04-arm
            arch: arm64
            slot: arm64-a
            qemu: qemu-system-arm
            side: a
          - runner: ubuntu-24.04-arm
            arch: arm64
            slot: arm64-b
            qemu: qemu-system-arm
            side: b
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DNIV_SCRATCH_DIR: ${{ github.workspace }}/scratch/runtime/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.slot }}
      DNIV_OUTER_BASE_DIR: ${{ github.workspace }}/scratch/outer/${{ matrix.arch }}
      DNIV_LAB_ARTIFACTS: /tmp/dniv-scale16-${{ github.run_id }}-${{ matrix.slot }}
      DNIV_LAB_SESSION_ID: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-scale16-dist
      VDE_SSH_HOST: ${{ secrets.VDE_SSH_HOST }}
      VDE_SSH_PORT: ${{ secrets.VDE_SSH_PORT }}
      VDE_SSH_USER: ${{ secrets.VDE_SSH_USER }}
      VDE_SSH_KEY: ${{ secrets.VDE_SSH_KEY }}
      VDE_SSH_KNOWN_HOSTS: ${{ secrets.VDE_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Initialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ -n '${{ inputs.expected_sha }}' ]]; then test "$candidate" = '${{ inputs.expected_sha }}'; fi
          python3 tools/scratch_state.py init --dir "$DNIV_SCRATCH_DIR"             --workflow scale16-distributed --job "${{ matrix.slot }}"             --arch '${{ matrix.arch }}' --mode scale16-distributed             --source-sha "$candidate" --parent-run-id '${{ inputs.parent_run_id }}'             --expected-sha '${{ inputs.expected_sha }}'
          tools/workflow_guard.sh "$DNIV_SCRATCH_DIR" "$candidate" main

      - name: Verify bastion prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for name in VDE_SSH_HOST VDE_SSH_PORT VDE_SSH_USER VDE_SSH_KEY VDE_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "missing required scale16 secret: $name" >&2; exit 2; }
            printf '::add-mask::%s\n' "${!name}"
          done

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu }} qemu-utils e2fsprogs tcpdump curl             build-essential cmake libvdeplug-dev openssh-client

      - name: Compute foundation identity
        id: foundation-id
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(cat image/ubuntu-base/images.env image/ubuntu-base/build-foundation.sh | sha256sum | cut -c1-16)
          session="outer-v2-${{ matrix.arch }}-$fingerprint"
          echo "DNIV_FOUNDATION_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "DNIV_OUTER_SESSION_ID=$session" >> "$GITHUB_ENV"
          echo "session_id=$session" >> "$GITHUB_OUTPUT"

      - name: Restore architecture foundation
        id: outer-base
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Download Ubuntu Base on miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          . image/ubuntu-base/images.env
          if [[ '${{ matrix.arch }}' == amd64 ]]; then file=$UBUNTU_BASE_AMD64; sha=$UBUNTU_BASE_AMD64_SHA256; else file=$UBUNTU_BASE_ARM64; sha=$UBUNTU_BASE_ARM64_SHA256; fi
          curl -fL "$UBUNTU_BASE_URL/$file" -o "$RUNNER_TEMP/$file"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
          echo "UBUNTU_BASE_TARBALL=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"

      - name: Build architecture foundation on miss
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DNIV_OUTER_BASE_DIR"
          mkdir -p "$DNIV_OUTER_BASE_DIR/boot"
          image/ubuntu-base/build-foundation.sh '${{ matrix.arch }}' "$UBUNTU_BASE_TARBALL"             "$DNIV_OUTER_BASE_DIR/base.qcow2" "$DNIV_OUTER_BASE_DIR/boot"
          . image/ubuntu-base/images.env
          cat > "$DNIV_OUTER_BASE_DIR/session.env" <<EOF
          FORMAT=2
          SESSION_ID=$DNIV_OUTER_SESSION_ID
          ARCH=${{ matrix.arch }}
          FOUNDATION_FINGERPRINT=$DNIV_FOUNDATION_FINGERPRINT
          UBUNTU_BASE_RELEASE=$UBUNTU_BASE_RELEASE
          UBUNTU_APT_SNAPSHOT=$UBUNTU_APT_SNAPSHOT
          EOF
          (cd "$DNIV_OUTER_BASE_DIR"; sha256sum base.qcow2 boot/vmlinuz boot/initrd.img session.env > SHA256SUMS)

      - name: Save architecture foundation
        if: ${{ steps.outer-base.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.DNIV_OUTER_BASE_DIR }}
          key: ${{ steps.foundation-id.outputs.session_id }}

      - name: Prepare exact candidate and VDE cable
        shell: bash
        run: |
          set -euo pipefail
          (cd "$DNIV_OUTER_BASE_DIR"; sha256sum -c SHA256SUMS)
          candidate="$RUNNER_TEMP/candidate-${{ matrix.slot }}.qcow2"
          tests/lab/prepare-candidate-image.sh "$DNIV_OUTER_BASE_DIR/base.qcow2" "$candidate"
          echo "DNIV_LAB_BASE=$candidate" >> "$GITHUB_ENV"
          echo "DNIV_LAB_KERNEL=$DNIV_OUTER_BASE_DIR/boot/vmlinuz" >> "$GITHUB_ENV"
          echo "DNIV_LAB_INITRD=$DNIV_OUTER_BASE_DIR/boot/initrd.img" >> "$GITHUB_ENV"

          . tests/reference/refs.env
          vde="$RUNNER_TEMP/vde2"
          git init -q "$vde"
          git -C "$vde" remote add origin https://github.com/tuklusan/vde-2.git
          git -C "$vde" fetch -q --depth=1 origin "$VDE2_REF"
          git -C "$vde" checkout -q --detach FETCH_HEAD
          test "$(git -C "$vde" rev-parse HEAD)" = "$VDE2_REF"
          cmake -S "$vde" -B "$RUNNER_TEMP/vde2-build" -DWITH_VDEPLUG4=OFF             -DENABLE_CRYPTCAB=OFF -DENABLE_VXLAN=OFF -DENABLE_ROUTER=OFF             -DENABLE_PCAP=OFF -DENABLE_TUNTAP=OFF -DENABLE_VDE_OVER_NS=OFF >/dev/null
          cmake --build "$RUNNER_TEMP/vde2-build" --target dpipe vde_plug2tap -j2 >/dev/null

          umask 077
          printf '%s\n' "$VDE_SSH_KEY" > "$RUNNER_TEMP/bastion.key"
          printf '%s\n' "$VDE_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          cat > "$RUNNER_TEMP/ssh_config" <<EOF
          Host dniv-bastion
              HostName $VDE_SSH_HOST
              User $VDE_SSH_USER
              Port $VDE_SSH_PORT
              IdentityFile $RUNNER_TEMP/bastion.key
              IdentitiesOnly yes
              BatchMode yes
              UserKnownHostsFile $RUNNER_TEMP/known_hosts
              StrictHostKeyChecking yes
              LogLevel ERROR
              ConnectTimeout 8
              ConnectionAttempts 1
              ServerAliveInterval 15
              ServerAliveCountMax 3
          EOF
          chmod 600 "$RUNNER_TEMP/bastion.key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/ssh_config"
          echo "DNIV_SCALE_SSH_CONFIG=$RUNNER_TEMP/ssh_config" >> "$GITHUB_ENV"

      - name: Run distributed scale16 partition
        shell: bash
        run: |
          set -uo pipefail
          arch='${{ matrix.arch }}'
          side='${{ matrix.side }}'
          tap="ds${arch:0:1}${side}${GITHUB_RUN_ID: -4}"
          relay="/tmp/dniv-scale16-${GITHUB_RUN_ID}-${arch}.sock"
          dpipe="$RUNNER_TEMP/vde2-build/src/dpipe"
          plug="$RUNNER_TEMP/vde2-build/src/vde_plug2tap"
          log="$DNIV_SCRATCH_DIR/cross-cable.log"
          cable_pid=
          start_cable() {
            : >"$log"
            if [[ "$side" == a ]]; then
              "$dpipe" sudo "$plug" -s - "$tap" = ssh -F "$DNIV_SCALE_SSH_CONFIG" dniv-bastion \
                "echo DNIV_CABLE_LISTENING >&2; exec socat 'UNIX-LISTEN:$relay,unlink-early,unlink-close' STDIO" \
                >"$log" 2>&1 &
              cable_marker=DNIV_CABLE_LISTENING
            else
              "$dpipe" sudo "$plug" -s - "$tap" = ssh -F "$DNIV_SCALE_SSH_CONFIG" dniv-bastion \
                "for i in \$(seq 1 2100); do if [ -S '$relay' ]; then echo DNIV_CABLE_READY >&2; exec socat 'UNIX-CONNECT:$relay' STDIO; fi; sleep 1; done; exit 111" \
                >"$log" 2>&1 &
              cable_marker=DNIV_CABLE_READY
            fi
            cable_pid=$!
          }
          trap '[[ -z "${cable_pid:-}" ]] || kill "$cable_pid" 2>/dev/null || true; [[ -z "${cable_pid:-}" ]] || wait "$cable_pid" 2>/dev/null || true' EXIT

          attached=0
          for attempt in $(seq 1 8); do
            start_cable
            for i in $(seq 1 100); do
              if [[ -e "/sys/class/net/$tap" ]]; then
                attached=1
                break
              fi
              kill -0 "$cable_pid" 2>/dev/null || break
              sleep .2
            done
            [[ "$attached" -eq 1 ]] && break
            wait "$cable_pid" 2>/dev/null || true
            cable_pid=
            sleep $((attempt * 2))
          done
          [[ "$attached" -eq 1 ]] || { cat "$log" >&2; exit 1; }

          marker_seen=0
          for i in $(seq 1 2115); do
            if grep -Fqx "$cable_marker" "$log"; then
              marker_seen=1
              break
            fi
            kill -0 "$cable_pid" 2>/dev/null || break
            sleep 1
          done
          if [[ "$marker_seen" -ne 1 ]]; then
            cat "$log" >&2 || true
            exit 1
          fi

          cable_ready="/tmp/dniv-scale16-${GITHUB_RUN_ID}-${arch}-cable-${side}.ready"
          peer_side=a
          [[ "$side" == a ]] && peer_side=b
          cable_peer="/tmp/dniv-scale16-${GITHUB_RUN_ID}-${arch}-cable-${peer_side}.ready"
          barrier_log="$DNIV_SCRATCH_DIR/cable-barrier.log"
          barrier_ok=0
          for attempt in $(seq 1 8); do
            : >"$barrier_log"
            if ssh -F "$DNIV_SCALE_SSH_CONFIG" dniv-bastion \
              ": > '$cable_ready'; for i in \$(seq 1 2100); do [ -f '$cable_peer' ] && exit 0; sleep 1; done; exit 111" \
              2>"$barrier_log"; then
              barrier_ok=1
              break
            fi
            if grep -Eqi 'Permission denied|Authentication failed|Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED' "$barrier_log"; then
              cat "$barrier_log" >&2 || true
              exit 1
            fi
            if grep -Eqi 'Connection reset by peer|kex_exchange_identification|Connection timed out|banner exchange|Connection refused' "$barrier_log"; then
              sleep $((attempt * 2))
              continue
            fi
            cat "$barrier_log" >&2 || true
            exit 1
          done
          [[ "$barrier_ok" -eq 1 ]] || { cat "$barrier_log" >&2 || true; exit 1; }

          rm -rf "$DNIV_LAB_ARTIFACTS"
          mkdir -p "$DNIV_LAB_ARTIFACTS"
          set +e
          python3 tests/lab/dniv_scale16_distributed.py             "$DNIV_LAB_BASE" "$DNIV_LAB_KERNEL" "$DNIV_LAB_INITRD"             --side "$side" --cross-tap "$tap"             --ssh-config "$DNIV_SCALE_SSH_CONFIG"             --sync-token "${GITHUB_RUN_ID}-${arch}" 2>&1 | tee "$DNIV_SCRATCH_DIR/scale16.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -ne 0 ]]; then cat "$log" >&2 || true; fi
          exit "$rc"

      - name: Verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/integrity_scan.py --rev "$GITHUB_SHA" --pass-id final             --baseline "$DNIV_SCRATCH_DIR/integrity/pass-1.json"             --output "$DNIV_SCRATCH_DIR/integrity/final.json"
          python3 tools/scratch_state.py verify --dir "$DNIV_SCRATCH_DIR"

      - name: Preserve evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-scale16-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DNIV_SCRATCH_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false
